name: TEAL corpus drivers

# Issue #2366 (epic #2364, Phase 25). Builds the Go driver (tools/teal-corpus)
# against the pinned go-algorand v5.0.5-stable through go-algorand's own
# libsodium entry point (`make libsodium`, see CLAUDE.md), runs its Go tests,
# checks that the committed expected/go.*.jsonl fixture rows are not stale, and
# diffs the Go and Rust drivers on the small fixture corpus. The Rust half's own
# tests (crates/tools/teal-corpus) also run in unit-tests.yml.

on:
  pull_request:
    paths:
      - "tools/teal-corpus/**"
      - "tools/avm-op-types/**"
      - "crates/core/algo-avm/tests/fixtures/go_op_types.jsonl"
      - "crates/tools/teal-corpus/**"
      - "crates/core/algo-avm/src/assembler.rs"
      - "crates/core/algo-avm/src/abi_verify.rs"
      - "crates/core/algo-avm/src/disassembler.rs"
      - "crates/core/algo-avm/src/type_track.rs"
      - "crates/core/algo-avm/src/type_track_table.rs"
      - "crates/core/algo-avm/tests/assemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/asm_go_parity.jsonl"
      - "crates/core/algo-avm/src/fields.rs"
      - "crates/core/algo-avm/src/bytecode.rs"
      - "crates/core/algo-avm/src/opcode.rs"
      - "crates/core/algo-avm/tests/disassemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/disasm_go_parity.jsonl"
      - "crates/core/algo-avm/tests/pc_details_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/pcdetails_go_parity.jsonl"
      - "crates/core/algo-avm/src/eval.rs"
      - "crates/core/algo-avm/src/sourcemap.rs"
      - "scripts/teal-corpus/**"
      - "crates/tools/goal-rust/**"
      - "tools/go-codec-json-oracle/**"
      - "crates/core/algo-codec/src/logicsig_go.rs"
      - "crates/core/algo-codec/tests/common/**"
      - "bin/kmd-rust/**"
      - "crates/node/algo-kmd/**"
      - ".github/workflows/teal-corpus-drivers.yml"
  push:
    branches: [main]
    paths:
      - "tools/teal-corpus/**"
      - "tools/avm-op-types/**"
      - "crates/core/algo-avm/tests/fixtures/go_op_types.jsonl"
      - "crates/tools/teal-corpus/**"
      - "crates/core/algo-avm/src/assembler.rs"
      - "crates/core/algo-avm/src/abi_verify.rs"
      - "crates/core/algo-avm/src/disassembler.rs"
      - "crates/core/algo-avm/src/type_track.rs"
      - "crates/core/algo-avm/src/type_track_table.rs"
      - "crates/core/algo-avm/tests/assemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/asm_go_parity.jsonl"
      - "crates/core/algo-avm/src/fields.rs"
      - "crates/core/algo-avm/src/bytecode.rs"
      - "crates/core/algo-avm/src/opcode.rs"
      - "crates/core/algo-avm/tests/disassemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/disasm_go_parity.jsonl"
      - "crates/core/algo-avm/tests/pc_details_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/pcdetails_go_parity.jsonl"
      - "crates/core/algo-avm/src/eval.rs"
      - "crates/core/algo-avm/src/sourcemap.rs"
      - "scripts/teal-corpus/**"
      - "crates/tools/goal-rust/**"
      - "tools/go-codec-json-oracle/**"
      - "crates/core/algo-codec/src/logicsig_go.rs"
      - "crates/core/algo-codec/tests/common/**"
      - "bin/kmd-rust/**"
      - "crates/node/algo-kmd/**"
      - ".github/workflows/teal-corpus-drivers.yml"
  workflow_dispatch:

concurrency:
  group: teal-corpus-drivers-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_ALGORAND_REV: "v5.0.5-stable"

jobs:
  go-and-rust-drivers:
    name: Go driver tests, fixture drift and Go-vs-Rust fixture diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build go-algorand's libsodium fork
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential
          # Sibling clone: tools/teal-corpus/go.mod replaces go-algorand with
          # ../../../go-algorand, and build.sh stamps its tag and commit.
          git clone --branch "$GO_ALGORAND_REV" \
            https://github.com/algorand/go-algorand.git \
            "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          cd "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          make libsodium

      - name: Go driver unit tests
        working-directory: tools/teal-corpus
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Type-tracking dump is not stale
        working-directory: tools/avm-op-types
        run: |
          set -euo pipefail
          go vet ./...
          go run . | diff - ../../crates/core/algo-avm/tests/fixtures/go_op_types.jsonl

      - name: Build the Go driver
        run: bash tools/teal-corpus/build.sh "$RUNNER_TEMP/teal-corpus-go"

      - name: Build the Rust driver
        run: cargo build -p teal-corpus --release

      - name: Go fixture rows are not stale
        run: |
          set -euo pipefail
          F=crates/tools/teal-corpus/tests/fixtures/small
          for op in disassemble assemble; do
            "$RUNNER_TEMP/teal-corpus-go" "$op" --corpus "$F" --out "$RUNNER_TEMP/$op.go.jsonl"
            # rows only: the first line is the header (go-algorand commit)
            diff <(tail -n +2 "$F/expected/go.$op.jsonl") <(tail -n +2 "$RUNNER_TEMP/$op.go.jsonl")
          done

      - name: Diff Go vs Rust on the fixture corpus
        run: |
          set -euo pipefail
          F=crates/tools/teal-corpus/tests/fixtures/small
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          # Disassembly (#2367), assembly of the fixture sources and reassembly
          # (#2368: go's disassembly assembled by both, plus the
          # rust.assemble(rust.disassemble) cross-check) are exact: zero
          # mismatches.
          bash scripts/teal-corpus/run_drivers.sh "$F" "$RUNNER_TEMP/out" disassemble assemble reassemble

      - name: Disassembly regression cases are not stale
        run: |
          set -euo pipefail
          python3 scripts/teal-corpus/disasm_fixtures.py --check --go-driver "$RUNNER_TEMP/teal-corpus-go"

      - name: pcDetails regression cases are not stale
        run: |
          set -euo pipefail
          # pcDetails is unexported: the oracle is a test file run inside the
          # sibling go-algorand checkout (libsodium already built above).
          python3 scripts/teal-corpus/pcdetails_fixtures.py --check --go-algorand "$(dirname "$GITHUB_WORKSPACE")/go-algorand"

      - name: Assembly regression cases are not stale
        run: |
          set -euo pipefail
          python3 scripts/teal-corpus/asm_fixtures.py --check --go-driver "$RUNNER_TEMP/teal-corpus-go"

      - name: Reassembly parity on a synthetic adversarial corpus
        run: |
          set -euo pipefail
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          # go's disassembly of the synthetic byte programs, assembled by both
          # (#2368): zero mismatches, panics, timeouts.
          python3 scripts/teal-corpus/gen_synthetic.py "$RUNNER_TEMP/syn" --sweep-versions 8 --random 5000
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/syn" "$RUNNER_TEMP/synre" reassemble
          # Typed pushes before every opcode and random stack/frame/branch
          # programs: the assembler's static type tracking against go's.
          python3 scripts/teal-corpus/gen_synthetic_asm.py "$RUNNER_TEMP/synasm" --random 20000 --versions 8,13
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/synasm" "$RUNNER_TEMP/synasmout" assemble

      - name: Assembly error-shaping parity on a synthetic adversarial corpus
        run: |
          set -euo pipefail
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          F=crates/tools/teal-corpus/tests/fixtures/small
          # Wrong immediates, bad literals and encodings, directives, macros and
          # odd whitespace, plus token-level mutations of the fixture sources
          # (#2369): zero mismatches in bytecode, source map, warnings and the
          # ordered error list (line, column, text). The corpus also holds sources
          # that are not UTF-8 (templates at every kind of position and 20000
          # byte-level mutations, #2388): go assembles any byte string.
          python3 scripts/teal-corpus/gen_synthetic_syntax.py "$RUNNER_TEMP/synsyntax" --count 20000 --mutate 20000 --mutate-bytes 20000 --mutate-from "$F"
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/synsyntax" "$RUNNER_TEMP/synsyntaxout" assemble

      - name: Disassembly parity on a synthetic adversarial corpus
        run: |
          set -euo pipefail
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          # Every opcode byte at every version, every immediate byte value (at
          # v8), random and truncated programs: zero mismatches, panics, timeouts.
          python3 scripts/teal-corpus/gen_synthetic.py "$RUNNER_TEMP/syn" --sweep-versions 8 --random 5000
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/syn" "$RUNNER_TEMP/synout" disassemble

  goal-clerk-compile-parity:
    name: goal clerk compile -D parity against go's goal (LogicSig decode fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build go-algorand's libsodium fork
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential
          # The e2e test builds `../go-algorand/cmd/goal` itself (try_ensure_go_goal),
          # which needs the libsodium fork first (see CLAUDE.md).
          git clone --branch "$GO_ALGORAND_REV" \
            https://github.com/algorand/go-algorand.git \
            "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          cd "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          make libsodium

      - name: Run clerk compile through go's goal and goal-rust
        run: |
          set -euo pipefail
          # #2388/#2390: `-D` of byte strings and of hand-made or damaged
          # LogicSig records prints what go's goal prints, and the committed
          # fixtures/clerk_lsig_decode.jsonl is exactly go's output (a stale
          # fixture fails lsig_decode_fixture_matches_go_goal).
          MIXED_CLUSTER=1 cargo test -p goal-rust --test clerk_compile_e2e -- --nocapture
          # #2393: `clerk sign -L` decodes the LogicSig like go's lsigFromArgs;
          # fixtures/clerk_sign_lsig.jsonl is go's output (a stale one fails
          # sign_lsig_fixture_matches_go_goal).
          MIXED_CLUSTER=1 cargo test -p goal-rust --test clerk_sign_lsig_e2e -- --nocapture
          # #2391: go's wallet handle token cache and terminal-only password
          # input, seen through `clerk compile -s` against a kmd-rust with the
          # password typed into a pty; fixtures/clerk_wallet_token.jsonl is go's
          # output (a stale one fails wallet_token_fixture_matches_go_goal).
          MIXED_CLUSTER=1 cargo test -p goal-rust --test clerk_wallet_token_e2e -- --nocapture
          # #2407: every other password prompt (`wallet new` and its
          # confirmation, `wallet rename`, the account commands) reads a
          # terminal only, the `--recover`/backup line reads fail on EOF like
          # go's bufio, and the flags go's goal does not define (`--password`,
          # `wallet new -w/--driver`, `--offline`, `--register`) are cobra's
          # `unknown flag`; fixtures/wallet_password.jsonl is go's output for
          # the pipe, /dev/null and pty paths (a stale one fails
          # wallet_password_fixture_matches_go_goal).
          MIXED_CLUSTER=1 cargo test -p goal-rust --test wallet_password_e2e -- --nocapture
          # #2436: a data dir whose genesis ID cannot be read stops every
          # command that builds go's accounts list (errorGenesisIDFail);
          # fixtures/genesis_id_fail.jsonl is go's output (a stale one fails
          # genesis_id_fail_fixture_matches_go_goal).
          MIXED_CLUSTER=1 cargo test -p goal-rust --test genesis_id_fail_e2e -- --nocapture
          # #2448: go's `account -f/--default`, `wallet -f/--default` and
          # `account import -m` against a kmd-rust; fixtures/default_flags.jsonl
          # is go's output (a stale one fails default_flags_fixture_matches_go_goal).
          # #2453: its rows also hold cobra's usage errors for extra arguments
          # to `account` / `wallet` and a `-f` before one of their subcommands.
          MIXED_CLUSTER=1 cargo test -p goal-rust --test default_flags_e2e -- --nocapture
          # #2454: go's client setup (ensureKmdClient / ensureAlgodClient /
          # ensureFullClient / getGoalClient): kmd started next to goal (go's
          # kmd, built from ../go-algorand/cmd/kmd, for go's goal), go's error
          # texts without kmd or algod, and consensus.json decoded by go's
          # encoding/json; fixtures/goal_client.jsonl is go's output (a stale
          # one fails goal_client_fixture_matches_go_goal). GOTOOLCHAIN pins
          # the toolchain of go-algorand v5.0.5-stable's go.mod for go's goal and kmd
          # (go1.25.3, as released): a newer `stable` go changes
          # encoding/json's error texts.
          GOTOOLCHAIN=go1.25.3 MIXED_CLUSTER=1 cargo test -p goal-rust --test goal_client_e2e -- --nocapture
          # #2460: `ledger block` (go's msgpack-to-JSON transcode), `version`,
          # `account list` (the one wallet ensureWalletHandle picks) and
          # errorRequestFail against a mock algod; fixtures/goal_algod_reads.jsonl
          # is go's output (a stale one fails goal_algod_reads_fixture_matches_go_goal).
          GOTOOLCHAIN=go1.25.3 MIXED_CLUSTER=1 cargo test -p goal-rust --test goal_algod_reads_e2e -- --nocapture
          # #2466: its rows also hold go's request errors (a refused or
          # answer-less connection, a 401) and go-codec's decode of malformed
          # JSON answers. The go-codec port itself is checked against go's own
          # decode of a corpus: fixtures/go_codec_json_decode.jsonl must be
          # exactly what tools/go-codec-json-oracle prints for it.
          GO_ALGORAND="$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          mkdir -p "$GO_ALGORAND/cmd/go-codec-json-oracle"
          cp tools/go-codec-json-oracle/main.go "$GO_ALGORAND/cmd/go-codec-json-oracle/"
          (cd "$GO_ALGORAND" && GOTOOLCHAIN=go1.25.3 go build -o "$RUNNER_TEMP/go-codec-json-oracle" ./cmd/go-codec-json-oracle)
          "$RUNNER_TEMP/go-codec-json-oracle" \
            < crates/tools/goal-rust/tests/fixtures/go_codec_json_decode.jsonl \
            > "$RUNNER_TEMP/go_codec_json_decode.jsonl"
          cmp "$RUNNER_TEMP/go_codec_json_decode.jsonl" crates/tools/goal-rust/tests/fixtures/go_codec_json_decode.jsonl
          cargo test -p goal-rust --test go_codec_json_parity

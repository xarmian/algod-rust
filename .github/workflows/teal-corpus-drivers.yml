name: TEAL corpus drivers

# Issue #2366 (epic #2364, Phase 25). Builds the Go driver (tools/teal-corpus)
# against the pinned go-algorand v5.0.5-stable through go-algorand's own
# libsodium entry point (`make libsodium`, see CLAUDE.md), runs its Go tests,
# checks that the committed expected/go.*.jsonl fixture rows are not stale, and
# diffs the Go and Rust drivers on the small fixture corpus. The Rust half's own
# tests (crates/tools/teal-corpus) also run in unit-tests.yml.

on:
  pull_request:
    paths:
      - "tools/teal-corpus/**"
      - "tools/avm-op-types/**"
      - "crates/core/algo-avm/tests/fixtures/go_op_types.jsonl"
      - "crates/tools/teal-corpus/**"
      - "crates/core/algo-avm/src/assembler.rs"
      - "crates/core/algo-avm/src/abi_verify.rs"
      - "crates/core/algo-avm/src/disassembler.rs"
      - "crates/core/algo-avm/src/type_track.rs"
      - "crates/core/algo-avm/src/type_track_table.rs"
      - "crates/core/algo-avm/tests/assemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/asm_go_parity.jsonl"
      - "crates/core/algo-avm/src/fields.rs"
      - "crates/core/algo-avm/src/bytecode.rs"
      - "crates/core/algo-avm/src/opcode.rs"
      - "crates/core/algo-avm/tests/disassemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/disasm_go_parity.jsonl"
      - "crates/core/algo-avm/tests/pc_details_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/pcdetails_go_parity.jsonl"
      - "crates/core/algo-avm/src/eval.rs"
      - "crates/core/algo-avm/src/sourcemap.rs"
      - "scripts/teal-corpus/**"
      - ".github/workflows/teal-corpus-drivers.yml"
  push:
    branches: [main]
    paths:
      - "tools/teal-corpus/**"
      - "tools/avm-op-types/**"
      - "crates/core/algo-avm/tests/fixtures/go_op_types.jsonl"
      - "crates/tools/teal-corpus/**"
      - "crates/core/algo-avm/src/assembler.rs"
      - "crates/core/algo-avm/src/abi_verify.rs"
      - "crates/core/algo-avm/src/disassembler.rs"
      - "crates/core/algo-avm/src/type_track.rs"
      - "crates/core/algo-avm/src/type_track_table.rs"
      - "crates/core/algo-avm/tests/assemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/asm_go_parity.jsonl"
      - "crates/core/algo-avm/src/fields.rs"
      - "crates/core/algo-avm/src/bytecode.rs"
      - "crates/core/algo-avm/src/opcode.rs"
      - "crates/core/algo-avm/tests/disassemble_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/disasm_go_parity.jsonl"
      - "crates/core/algo-avm/tests/pc_details_go_parity.rs"
      - "crates/core/algo-avm/tests/fixtures/pcdetails_go_parity.jsonl"
      - "crates/core/algo-avm/src/eval.rs"
      - "crates/core/algo-avm/src/sourcemap.rs"
      - "scripts/teal-corpus/**"
      - ".github/workflows/teal-corpus-drivers.yml"
  workflow_dispatch:

concurrency:
  group: teal-corpus-drivers-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_ALGORAND_REV: "v5.0.5-stable"

jobs:
  go-and-rust-drivers:
    name: Go driver tests, fixture drift and Go-vs-Rust fixture diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build go-algorand's libsodium fork
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential
          # Sibling clone: tools/teal-corpus/go.mod replaces go-algorand with
          # ../../../go-algorand, and build.sh stamps its tag and commit.
          git clone --branch "$GO_ALGORAND_REV" \
            https://github.com/algorand/go-algorand.git \
            "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          cd "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          make libsodium

      - name: Go driver unit tests
        working-directory: tools/teal-corpus
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Type-tracking dump is not stale
        working-directory: tools/avm-op-types
        run: |
          set -euo pipefail
          go vet ./...
          go run . | diff - ../../crates/core/algo-avm/tests/fixtures/go_op_types.jsonl

      - name: Build the Go driver
        run: bash tools/teal-corpus/build.sh "$RUNNER_TEMP/teal-corpus-go"

      - name: Build the Rust driver
        run: cargo build -p teal-corpus --release

      - name: Go fixture rows are not stale
        run: |
          set -euo pipefail
          F=crates/tools/teal-corpus/tests/fixtures/small
          for op in disassemble assemble; do
            "$RUNNER_TEMP/teal-corpus-go" "$op" --corpus "$F" --out "$RUNNER_TEMP/$op.go.jsonl"
            # rows only: the first line is the header (go-algorand commit)
            diff <(tail -n +2 "$F/expected/go.$op.jsonl") <(tail -n +2 "$RUNNER_TEMP/$op.go.jsonl")
          done

      - name: Diff Go vs Rust on the fixture corpus
        run: |
          set -euo pipefail
          F=crates/tools/teal-corpus/tests/fixtures/small
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          # Disassembly (#2367), assembly of the fixture sources and reassembly
          # (#2368: go's disassembly assembled by both, plus the
          # rust.assemble(rust.disassemble) cross-check) are exact: zero
          # mismatches.
          bash scripts/teal-corpus/run_drivers.sh "$F" "$RUNNER_TEMP/out" disassemble assemble reassemble

      - name: Disassembly regression cases are not stale
        run: |
          set -euo pipefail
          python3 scripts/teal-corpus/disasm_fixtures.py --check --go-driver "$RUNNER_TEMP/teal-corpus-go"

      - name: pcDetails regression cases are not stale
        run: |
          set -euo pipefail
          # pcDetails is unexported: the oracle is a test file run inside the
          # sibling go-algorand checkout (libsodium already built above).
          python3 scripts/teal-corpus/pcdetails_fixtures.py --check --go-algorand "$(dirname "$GITHUB_WORKSPACE")/go-algorand"

      - name: Assembly regression cases are not stale
        run: |
          set -euo pipefail
          python3 scripts/teal-corpus/asm_fixtures.py --check --go-driver "$RUNNER_TEMP/teal-corpus-go"

      - name: Reassembly parity on a synthetic adversarial corpus
        run: |
          set -euo pipefail
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          # go's disassembly of the synthetic byte programs, assembled by both
          # (#2368): zero mismatches, panics, timeouts.
          python3 scripts/teal-corpus/gen_synthetic.py "$RUNNER_TEMP/syn" --sweep-versions 8 --random 5000
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/syn" "$RUNNER_TEMP/synre" reassemble
          # Typed pushes before every opcode and random stack/frame/branch
          # programs: the assembler's static type tracking against go's.
          python3 scripts/teal-corpus/gen_synthetic_asm.py "$RUNNER_TEMP/synasm" --random 20000 --versions 8,13
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/synasm" "$RUNNER_TEMP/synasmout" assemble

      - name: Assembly error-shaping parity on a synthetic adversarial corpus
        run: |
          set -euo pipefail
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          F=crates/tools/teal-corpus/tests/fixtures/small
          # Wrong immediates, bad literals and encodings, directives, macros and
          # odd whitespace, plus token-level mutations of the fixture sources
          # (#2369): zero mismatches in bytecode, source map, warnings and the
          # ordered error list (line, column, text).
          python3 scripts/teal-corpus/gen_synthetic_syntax.py "$RUNNER_TEMP/synsyntax" --count 20000 --mutate 20000 --mutate-from "$F"
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/synsyntax" "$RUNNER_TEMP/synsyntaxout" assemble

      - name: Disassembly parity on a synthetic adversarial corpus
        run: |
          set -euo pipefail
          export GO_DRIVER="$RUNNER_TEMP/teal-corpus-go" RUST_DRIVER="$PWD/target/release/teal-corpus"
          # Every opcode byte at every version, every immediate byte value (at
          # v8), random and truncated programs: zero mismatches, panics, timeouts.
          python3 scripts/teal-corpus/gen_synthetic.py "$RUNNER_TEMP/syn" --sweep-versions 8 --random 5000
          bash scripts/teal-corpus/run_drivers.sh "$RUNNER_TEMP/syn" "$RUNNER_TEMP/synout" disassemble

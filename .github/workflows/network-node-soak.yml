name: Network Node Soak (reusable)

# Issue #2071 (epic #2068) -- the network-parameterised core of the nightly
# node soak that issue #1598 introduced for mainnet. `mainnet-node-soak.yml`
# is now a thin caller of this workflow; voimain / aramidmain soaks are
# further thin callers (they differ only in the `with:` block).
#
# A single algod-rust node, configured exactly as an operator would run it
# (`participate --network <network>`), bootstrapped with fast catchup against
# a real relay/archival endpoint, run directly on the GitHub-hosted runner
# (no cluster, no Docker harness). Measures how long fast catchup takes on a
# CI runner and detects the node halting -- mid-catchup or after reaching the
# tip -- auto-filing a GitHub issue when it does.
#
# ## What runs
#
#   1. Self-test `ops/mainnet-soak/monitor.py` (the directory keeps its
#      historical name; see docs/NETWORK_PRESETS.md) and build `algod-rust`.
#   2. Discover a catchpoint-file-serving relay (`relay_discovery`).
#   3. Start `algod-rust participate --network <network>` as a fresh,
#      zero-stake, outbound-only node.
#   4. Resolve the catchpoint label (`catchpoint_index_url`, else the peer's
#      own `/v2/status` `last-catchpoint`) and `POST /v2/catchup/{label}`.
#   5. Poll node + peer `/v2/status` via `monitor.py collect`.
#   6. Tear down, summarise, upload artifacts, and on a halt verdict
#      (`stuck`/`node_failure`/`invalid_block_stall`) file or comment on a
#      network-scoped GitHub issue via `file_issue.py`.
#
# `source_outage` (the catchup peer itself unreachable / not advancing) is a
# warning only and never files an issue -- see `monitor.py`'s doc comment.
#
# Inputs
#   network               `--network` value and naming prefix (artifact dir,
#                         temp dirs, cache key, issue label/title/dedup key).
#   genesis_id            e.g. mainnet-v1.0
#   genesis_path          repo-relative genesis JSON (--genesis-json/--genesis-path)
#   peer_url              catchup peer REST URL (already defaulted by the caller)
#   relay_discovery       `srv:<name>` -> dig SRV `<name>` and pick the first
#                         relay answering HTTP; `peer` -> use peer_url as the
#                         catchup peer as-is.
#   catchpoint_index_url  static latest.catchpoint index; empty -> the peer's
#                         own /v2/status last-catchpoint.
#   probe_catchpoint_file "true" -> only accept an SRV relay that actually
#                         serves the latest catchpoint's ledger file (issue
#                         #2072: on Voi only some relays do; default "false").
#   consensus_json        optional repo-relative consensus.json copied into
#                         the node data dir (custom-consensus chains).
#   node_config_version   config.json "Version" pin (algo_config::LATEST_VERSION).

on:
  workflow_call:
    inputs:
      network:
        type: string
        required: true
      genesis_id:
        type: string
        required: true
      genesis_path:
        type: string
        required: true
      peer_url:
        type: string
        required: true
      relay_discovery:
        type: string
        required: true
      catchpoint_index_url:
        type: string
        default: ""
      probe_catchpoint_file:
        type: string
        default: "false"
      consensus_json:
        type: string
        default: ""
      node_config_version:
        type: string
        default: "38"
      duration_minutes:
        type: string
        default: "240"
      follow_minutes:
        type: string
        default: "120"
      halt_minutes:
        type: string
        default: "5"
      dry_run_issues:
        type: string
        default: ""
      shadow_execute:
        type: string
        default: "false"
      shadow_execute_sample_every:
        type: string
        default: "1"
      rust_log:
        type: string
        default: ""

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ALGOD_TOKEN: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

jobs:
  node-soak:
    name: ${{ inputs.network }} participation-node soak (fast catchup + halt detection)
    runs-on: ubuntu-latest
    env:
      NET: ${{ inputs.network }}
      ART: ${{ inputs.network }}-soak-artifacts
    # duration_minutes (default 240 = ~60-75 min catchup + 120 min follow
    # window + margin) plus build/catchup-discovery/teardown/scan overhead --
    # a hard stop so a wedged node can't hold a runner all day. 350 is just
    # under GitHub-hosted's 360 min limit; the "Resolve run parameters" step
    # clamps duration_minutes to 315 so the monitor step's 320 min timeout
    # (duration + 3 min shell cap, see below) always fits inside it.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.network }}-node-soak
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Self-test the monitor/issue-filer before trusting them
        run: python3 ops/mainnet-soak/monitor.py self-test

      - name: Build algod-rust (release)
        run: cargo build --release --bin algod-rust

      - name: Resolve run parameters
        id: params
        # Dispatch inputs reach the script through env, never interpolated into
        # the shell text (script injection).
        env:
          IN_DURATION_MINUTES: ${{ inputs.duration_minutes || '240' }}
          IN_FOLLOW_MINUTES: ${{ inputs.follow_minutes || '120' }}
          IN_HALT_MINUTES: ${{ inputs.halt_minutes || '5' }}
          IN_DRY_RUN: ${{ inputs.dry_run_issues }}
          IN_ALGOD_URL: ${{ inputs.peer_url }}
          IN_SHADOW_EXECUTE: ${{ inputs.shadow_execute }}
          IN_SHADOW_SAMPLE: ${{ inputs.shadow_execute_sample_every }}
        run: |
          DURATION_MINUTES="$IN_DURATION_MINUTES"
          FOLLOW_MINUTES="$IN_FOLLOW_MINUTES"
          # The job (350 min) and monitor step (320 min) timeouts only fit a
          # poll budget up to 315 min; clamp rather than get the whole job
          # (and its artifacts) killed by the runner.
          if [ "$DURATION_MINUTES" -gt 315 ]; then
            echo "::warning::duration_minutes=$DURATION_MINUTES exceeds the 315 minute ceiling; clamping"
            DURATION_MINUTES=315
          fi
          HALT_MINUTES="$IN_HALT_MINUTES"
          DRY_RUN="$IN_DRY_RUN"
          # workflow_dispatch's boolean input renders as the string "true"/
          # "false"; a schedule run has no inputs at all (empty string) and
          # must default to a REAL (non-dry-run) filing — dry-run is only
          # ever the manual-testing default, never the nightly behavior.
          if [ -z "$DRY_RUN" ]; then DRY_RUN="false"; fi
          # The caller resolves dispatch override / repo variable / preset
          # default into peer_url, so it is never empty here.
          ALGOD_URL="$IN_ALGOD_URL"
          echo "duration_minutes=$DURATION_MINUTES" >> "$GITHUB_OUTPUT"
          echo "halt_minutes=$HALT_MINUTES" >> "$GITHUB_OUTPUT"
          echo "follow_minutes=$FOLLOW_MINUTES" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          SHADOW_EXECUTE="$IN_SHADOW_EXECUTE"
          if [ "$SHADOW_EXECUTE" = "true" ]; then SHADOW_EXECUTE=1; else SHADOW_EXECUTE=0; fi
          echo "shadow_execute=$SHADOW_EXECUTE" >> "$GITHUB_OUTPUT"
          SHADOW_SAMPLE="$IN_SHADOW_SAMPLE"
          case "$SHADOW_SAMPLE" in
            ''|*[!0-9]*|0) SHADOW_SAMPLE=1 ;;
            ??????????*)
              # More than 9 digits: clamp loudly instead of silently
              # falling back to 1 (or overflowing the node's parser).
              echo "::warning::shadow_execute_sample_every has more than 9 digits; clamping to 999999999"
              SHADOW_SAMPLE=999999999 ;;
          esac
          echo "shadow_execute_sample_every=$SHADOW_SAMPLE" >> "$GITHUB_OUTPUT"
          echo "algod_url=$ALGOD_URL" >> "$GITHUB_OUTPUT"
          echo "Run parameters: duration=${DURATION_MINUTES}m follow=${FOLLOW_MINUTES}m halt=${HALT_MINUTES}m dry_run=${DRY_RUN} peer=${ALGOD_URL}"

      - name: Discover a real catchpoint-file-serving relay
        id: relay
        env:
          RELAY_DISCOVERY: ${{ inputs.relay_discovery }}
          PEER_URL: ${{ steps.params.outputs.algod_url }}
          PROBE_CATCHPOINT_FILE: ${{ inputs.probe_catchpoint_file }}
          CATCHPOINT_INDEX_URL: ${{ inputs.catchpoint_index_url }}
          GENESIS_ID: ${{ inputs.genesis_id }}
        run: |
          set -uo pipefail

          # relay_discovery=peer: the REST peer itself serves the ledger
          # catchpoint-file path (no separate gossip relay needed).
          if [ "$RELAY_DISCOVERY" = "peer" ]; then
            echo "==> relay_discovery=peer: using $PEER_URL as the catchup peer"
            echo "catchup_peer_url=$PEER_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$RELAY_DISCOVERY" in
            srv:?*) SRV_NAME="${RELAY_DISCOVERY#srv:}" ;;
            *)
              echo "fatal: relay_discovery must be 'peer' or 'srv:<name>' (got '$RELAY_DISCOVERY')" >&2
              exit 1
              ;;
          esac

          # Issue #1598 (found live, sixth dispatch attempt): the
          # documented --algod-url default (mainnet-api.4160.nodely.dev,
          # steps.params.outputs.algod_url) is a third-party REST GATEWAY
          # -- it serves the wallet-facing /v2/... API but 404s on the
          # internal /v1/{genesisID}/ledger/{round} ledger/catchpoint-file
          # service (confirmed live: "sync state transition ... to=Failed:
          # not found: catchpoint GET /v1/mainnet-v1.0/ledger/12x3tc").
          # go-algorand's own CatchpointCatchupService
          # (catchup/catchpointService.go) never asks an arbitrary REST
          # peer for this either -- it downloads over the gossip network
          # from a real, gossip-connected relay. algod-rust's
          # --catchup-peer (issue #940) is a REST-only simplification of
          # that, so it needs a REST URL pointed at an actual relay --
          # confirmed live (plain curl, no algod-rust involved) that a
          # real DNS-discovered mainnet relay serves this same ledger
          # path directly over plain HTTP GET on its gossip port (4160),
          # streaming real catchpoint data.
          #
          # Discover one the same way the node itself does: an SRV lookup
          # for _algobootstrap._tcp.mainnet.algorand.network (the same
          # service name algo_network::discovery queries, dns_bootstrap_id
          # template "<network>.algorand.network" mirroring go's DNS
          # bootstrap), then confirm the candidate actually answers on
          # its gossip port before committing to it as --catchup-peer.
          if ! command -v dig >/dev/null 2>&1; then
            echo "fatal: dig is not available on this runner -- cannot resolve relay SRV records for $SRV_NAME" >&2
            exit 1
          fi

          mapfile -t SRV_RECORDS < <(dig +short SRV "$SRV_NAME" 2>/dev/null)
          if [ "${#SRV_RECORDS[@]}" -eq 0 ]; then
            echo "fatal: SRV lookup for $SRV_NAME returned nothing" >&2
            exit 1
          fi
          echo "==> ${#SRV_RECORDS[@]} candidate relay(s) from SRV lookup"

          # Issue #2072: on some networks (Voi) only a subset of the SRV
          # relays serve the catchpoint file -- the others answer 404 or
          # nothing at all, and the public REST gateway never serves it. With
          # probe_catchpoint_file=true, only a relay that really answers the
          # latest catchpoint's ledger file (GET /v1/<genesis>/ledger/<round in
          # base 36>, what go's catchpoint service requests) is accepted.
          PROBE_PATH=""
          if [ "$PROBE_CATCHPOINT_FILE" = "true" ]; then
            if [ -n "$CATCHPOINT_INDEX_URL" ]; then
              PROBE_LABEL="$(curl -sf -m 20 "$CATCHPOINT_INDEX_URL" | tr -d '[:space:]')"
            else
              PROBE_LABEL="$(curl -sf -m 20 "$PEER_URL/v2/status" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("last-catchpoint") or "")')"
            fi
            PROBE_ROUND="${PROBE_LABEL%%#*}"
            case "$PROBE_ROUND" in
              ''|*[!0-9]*)
                echo "fatal: probe_catchpoint_file needs a catchpoint label; got '$PROBE_LABEL'" >&2
                exit 1
                ;;
            esac
            PROBE_B36="$(python3 -c 'import string,sys; n=int(sys.argv[1]); d=string.digits+string.ascii_lowercase; s=[]; exec("while n: s.append(d[n%36]); n//=36"); print("".join(reversed(s)) or "0")' "$PROBE_ROUND")"
            PROBE_PATH="/v1/$GENESIS_ID/ledger/$PROBE_B36"
            echo "==> probing relays for the catchpoint file of $PROBE_LABEL ($PROBE_PATH)"
          fi

          RELAY_URL=""
          for record in "${SRV_RECORDS[@]}"; do
            # SRV record format: <priority> <weight> <port> <target.>
            PORT="$(printf '%s' "$record" | awk '{print $3}')"
            TARGET="$(printf '%s' "$record" | awk '{print $4}' | sed 's/\.$//')"
            if [ -z "$PORT" ] || [ -z "$TARGET" ]; then
              continue
            fi
            CANDIDATE="http://$TARGET:$PORT"
            if [ -n "$PROBE_PATH" ]; then
              # The relay streams the whole file for a GET (Range is ignored),
              # so cut the transfer after a few seconds; the status code is
              # still reported (curl exits 28 on the cut, hence `|| true` --
              # issue #2099).
              FILE_CODE="$(curl -s -m 8 -o /dev/null -w '%{http_code}' "$CANDIDATE$PROBE_PATH")" || true
              echo "==> probing $CANDIDATE (catchpoint file HTTP $FILE_CODE)"
              if [ "$FILE_CODE" = "200" ]; then
                RELAY_URL="$CANDIDATE"
                break
              fi
              continue
            fi
            HTTP_CODE="$(curl -s -m 10 -o /dev/null -w '%{http_code}' "$CANDIDATE/v2/status")" || true
            echo "==> trying $CANDIDATE (status endpoint HTTP $HTTP_CODE)"
            if [ "$HTTP_CODE" != "000" ]; then
              # Any real HTTP response (even a 4xx from a relay that
              # doesn't serve /v2/status the way a REST gateway does)
              # proves this is a live, reachable HTTP server on this
              # port -- unlike a REST-gateway-only endpoint, a real
              # relay's own catchpoint-file path is what actually
              # matters and is confirmed separately below.
              RELAY_URL="$CANDIDATE"
              break
            fi
          done
          if [ -z "$RELAY_URL" ]; then
            echo "fatal: none of the ${#SRV_RECORDS[@]} candidate relays answered over HTTP" >&2
            exit 1
          fi
          echo "==> selected catchup peer: $RELAY_URL"
          echo "catchup_peer_url=$RELAY_URL" >> "$GITHUB_OUTPUT"

      - name: Log runner spec (issue #1626 profiling baseline)
        run: |
          mkdir -p ${ART}
          {
            echo "=== nproc ==="
            nproc || true
            echo "=== free -h ==="
            free -h || true
            echo "=== df -h ==="
            df -h || true
            echo "=== /proc/cpuinfo (model name) ==="
            grep -m1 'model name' /proc/cpuinfo || true
          } | tee ${ART}/runner-spec.txt

      - name: Install gdb (thread-stack dump if the node wedges, issue #1650)
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq gdb >/dev/null 2>&1 || echo "gdb unavailable; wedge stack dumps disabled"
          command -v gdb || true

      - name: Start resource profiling (issue #1626)
        id: profiling
        run: |
          # Issue #1626: mainnet-node-soak dies (external SIGTERM) during
          # catchpoint verify with no direct CPU/memory evidence from the
          # failing run, because the process died before any artifact
          # upload. Sample system + node-process resource usage every 10s
          # for the whole job so a future dying run still uploads a trace
          # of exactly what the runner's CPU/memory looked like right up to
          # the point of death (the "Upload artifacts" step runs with
          # `if: always()`, so this file is captured even on a killed job).
          #
          # IMPORTANT: the backgrounded subshell must not inherit this
          # step's stdout/stderr. A backgrounded child that keeps those
          # file descriptors open is a well-known GitHub Actions runner
          # hang: the runner's log-streaming pipe for the step never sees
          # EOF, and later `if: always()` steps can be marked "skipped"
          # while the job hangs at its own final "Complete job" bookkeeping
          # until the job-level `timeout-minutes` forcibly cancels it. Every
          # stream (stdin/stdout/stderr) is explicitly redirected away from
          # the parent shell's descriptors below (`</dev/null`, and stdout/
          # stderr into the CSV file / `/dev/null` respectively) specifically
          # to avoid that trap.
          (
            echo "timestamp,free_h,algod_rss_kb,algod_cpu_pct,load_avg,algod_threads,all_threads,open_fds" > ${ART}/resource-log.csv
            while true; do
              TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              FREE_LINE="$(free -m | awk '/^Mem:/ {printf "used=%sMiB/avail=%sMiB", $3, $7}')"
              LOADAVG="$(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null || echo n/a)"
              # RSS + %CPU of the algod-rust node process specifically, if running.
              ALGOD_STATS="$(ps -C algod-rust -o rss=,pcpu= 2>/dev/null | awk '{rss+=$1; cpu+=$2} END {if (NR>0) printf "%d,%.1f", rss, cpu; else print "n/a,n/a"}')"
              APID="$(pgrep -x algod-rust 2>/dev/null | head -n 1)"
              ATHREADS="$( [ -n "$APID" ] && ls /proc/$APID/task 2>/dev/null | wc -l || echo n/a )"
              AFDS="$( [ -n "$APID" ] && ls /proc/$APID/fd 2>/dev/null | wc -l || echo n/a )"
              ALLTHREADS="$(ps -eLf 2>/dev/null | wc -l)"
              echo "${TS},\"${FREE_LINE}\",${ALGOD_STATS},\"${LOADAVG}\",${ATHREADS},${ALLTHREADS},${AFDS}" >> ${ART}/resource-log.csv
              sleep 10
            done
          ) </dev/null >/dev/null 2>&1 &
          disown
          echo "profiling_pid=$!" >> "$GITHUB_OUTPUT"

      - name: Start the participation node
        id: start_node
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
          CATCHUP_PEER_URL: ${{ steps.relay.outputs.catchup_peer_url }}
          PROBE_CATCHPOINT_FILE: ${{ inputs.probe_catchpoint_file }}
          # Issue #1673: opt-in Replay-vs-Execute differential check.
          ALGOD_SHADOW_EXECUTE: ${{ steps.params.outputs.shadow_execute }}
          ALGOD_SHADOW_EXECUTE_SAMPLE_EVERY: ${{ steps.params.outputs.shadow_execute_sample_every }}
          IN_RUST_LOG: ${{ inputs.rust_log }}
          GENESIS_ID: ${{ inputs.genesis_id }}
          GENESIS_PATH: ${{ inputs.genesis_path }}
          CONSENSUS_JSON: ${{ inputs.consensus_json }}
          CONFIG_VERSION: ${{ inputs.node_config_version }}
        run: |
          set -euo pipefail
          # Optional diagnostics filter (workflow_dispatch `rust_log`); unset
          # unless given so the default log filter is untouched.
          if [ -n "${IN_RUST_LOG:-}" ]; then
            export RUST_LOG="$IN_RUST_LOG"
            echo "RUST_LOG=$RUST_LOG"
          fi
          mkdir -p ${ART}
          mkdir -p /tmp/${NET}-soak-ledger /tmp/${NET}-soak-partkeys /tmp/${NET}-soak-data

          # Without --data-dir the REST server generates a random ephemeral
          # token we'd never see, and every curl call below would 401 --
          # seed known algod.token/algod.admin.token files instead, the
          # same pattern ops/mixed-cluster-p2p/scripts/start.sh uses.
          printf '%s' "$ALGOD_TOKEN" > /tmp/${NET}-soak-data/algod.token
          printf '%s' "$ALGOD_TOKEN" > /tmp/${NET}-soak-data/algod.admin.token

          # Issue #1600 (fixed by PR #1610): real mainnet DNS-SRV bootstrap
          # discovery used to hit hickory-resolver's DNSSEC validator
          # ("exceeded max validation depth") against
          # mainnet.algorand.network's real DNSSEC chain. Root cause was
          # `ResolverOpts::edns0` never being set on
          # `HickorySrvResolver` (crates/node/algo-network/src/
          # srv_resolver.rs), so DNSSEC validation queries fell back to a
          # 512-byte legacy payload size, truncating mainnet's real
          # ~70-record SRV response and forcing enough TCP-fallback
          # retries to exceed hickory-proto's internal recursion-depth
          # guard -- not a real DNSSEC validity problem with
          # mainnet.algorand.network, and not anything a node-side
          # config override could fix correctly. PR #1610 sets
          # `opts.edns0 = true` and live-verified 10/10 real-DNS
          # integration tests with `validate_dnssec=true`, so this soak
          # no longer needs (and must not carry) a `DNSSecurityFlags: 0`
          # override that disabled DNSSEC entirely -- that only masked
          # the symptom and diverged from go-algorand's own real default
          # (DNSSEC enforcement ON, `DNSSecuritySRVEnforced()`). Omitting
          # the field lets it fall back to its normal versioned default
          # (`DNS_SECURITY_FLAGS.at(LATEST_VERSION)` = 9, SRV + TXT bits
          # set, i.e. enforced) via serde's `default_dns_security_flags`
          # (crates/node/algo-config/src/lib.rs).
          #
          # "Version" must still be pinned to algo_config::LATEST_VERSION
          # (found live, second dispatch attempt, issue #1598) --
          # unrelated to the DNSSEC workaround and must stay regardless
          # of it: Local::migrate() walks a config with no "Version"
          # field (defaults to 0) forward through every versioned-default
          # table, and several of those tables (DNS_SECURITY_FLAGS
          # included) have different defaults at version 0 than at
          # LATEST_VERSION -- migrate_field() only preserves a field
          # whose CURRENT value differs from "the default AT THE VERSION
          # IT'S CURRENTLY AT", so any hand-written config.json with no
          # "Version" field risks its fields being silently migrated to
          # the wrong versioned default. Pinning Version to LATEST_VERSION
          # short-circuits the migration loop (`while self.version <
          # LATEST_VERSION`) entirely. LATEST_VERSION is 38 as of this
          # comment (crates/node/algo-config/src/lib.rs) -- update this if
          # that constant changes.
          echo "{\"Version\": ${CONFIG_VERSION}}" > /tmp/${NET}-soak-data/config.json
          # Optional custom consensus table (e.g. aramidmain); the node
          # merges <data_dir>/consensus.json on top of its built-ins.
          if [ -n "$CONSENSUS_JSON" ]; then
            cp "$CONSENSUS_JSON" /tmp/${NET}-soak-data/consensus.json
          fi

          # Network genesis (mainnet: the same fixture `make replay-mainnet*`
          # uses against a live archival node). A fresh, empty
          # participation-key store is intentional: this soak proves the
          # node runs, gossips, and catches up, not that it votes (zero
          # stake, matching every other read-only/observer node this repo
          # already runs in CI).
          # Issue #2072 (found live on voimain): the SRV relays that do NOT
          # serve the catchpoint file are pruned too -- after catchup the
          # follow path asked them for rounds just above the catchpoint and
          # got "requested block is not available" ~650 times in 5 min,
          # stalling at the catchpoint round. In probe mode the relay that
          # proved it holds the catchpoint (and the blocks above it) is also
          # pinned as the gossip peer.
          PEER_ARGS=()
          if [ "$PROBE_CATCHPOINT_FILE" = "true" ]; then
            PEER_ARGS=(--peers "${CATCHUP_PEER_URL#http://}")
            echo "==> probe mode: gossip peer pinned to ${CATCHUP_PEER_URL#http://}"
          fi
          ./target/release/algod-rust participate \
            "${PEER_ARGS[@]}" \
            --network "$NET" \
            --genesis-id "$GENESIS_ID" \
            --genesis-json "$GENESIS_PATH" \
            --genesis-path "$GENESIS_PATH" \
            --ledger-path /tmp/${NET}-soak-ledger/ledger \
            --partkey-path /tmp/${NET}-soak-partkeys/partkeys.sqlite \
            --data-dir /tmp/${NET}-soak-data \
            --rest-listen 127.0.0.1:8180 \
            --catchup-peer "$CATCHUP_PEER_URL" \
            --catchup-peer-token "" \
            > ${ART}/node.log 2>&1 &
          echo "node_pid=$!" >> "$GITHUB_OUTPUT"

          echo "==> waiting for the node's REST API"
          for _ in $(seq 1 60); do
            if curl -sf -H "X-Algo-API-Token: $ALGOD_TOKEN" http://127.0.0.1:8180/v2/status >/dev/null 2>&1; then
              echo "node is serving /v2/status"
              exit 0
            fi
            sleep 2
          done
          echo "fatal: node never answered /v2/status" >&2
          tail -n 200 ${ART}/node.log >&2 || true
          exit 1

      - name: Start fast catchup
        id: catchup
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
          CATCHPOINT_INDEX_URL: ${{ inputs.catchpoint_index_url }}
        run: |
          set -uo pipefail

          # A silent `curl | python3` pipeline under `set -e` gives no
          # diagnostic at all when either side fails (found live, third
          # dispatch attempt: the step died with no message right after
          # this echo). Every stage below is checked and diagnosed on its
          # own, so a repeat is actually debuggable from the log alone --
          # retry a few times first, since a public third-party endpoint
          # returning a transient 429/5xx is not the same class of
          # problem as it being genuinely unreachable.

          echo "==> checking the catchup peer's own /v2/status ($ALGOD_URL)"
          PEER_HTTP_CODE=""
          for attempt in 1 2 3 4 5; do
            PEER_HTTP_CODE="$(curl -s -o /tmp/peer-status.json -w '%{http_code}' "$ALGOD_URL/v2/status")" || true
            if [ "$PEER_HTTP_CODE" = "200" ]; then
              break
            fi
            echo "==> attempt $attempt: catchup peer /v2/status returned HTTP $PEER_HTTP_CODE, retrying in 5s"
            sleep 5
          done
          if [ "$PEER_HTTP_CODE" != "200" ]; then
            echo "fatal: catchup peer never returned HTTP 200 for /v2/status (last: $PEER_HTTP_CODE)" >&2
            echo "response body (if any):" >&2
            cat /tmp/peer-status.json >&2 2>/dev/null || true
            exit 1
          fi
          echo "==> peer reachable: $(cat /tmp/peer-status.json)"

          # Issue #1604: the peer's own /v2/status.last-catchpoint is only
          # populated when THAT node happens to be generating catchpoints
          # locally -- found live against the documented default
          # (https://mainnet-api.4160.nodely.dev): a perfectly healthy
          # /v2/status with an empty last-catchpoint, because that
          # endpoint doesn't run local catchpoint generation. go-algorand's
          # own `goal node catchup NETWORK` (no explicit label -- the
          # direct precedent for auto-discovery) never asks a peer's own
          # status at all; it fetches the Algorand-maintained static index
          # (cmd/goal/node.go's `catchpointURL` template). Use that same
          # index directly rather than depending on this specific peer
          # happening to have a fresh catchpoint of its own -- this repo's
          # own --catchpoint-auto has the same gap (tracked separately,
          # #1604) but fixing it there is out of scope for this workflow.
          #
          # Networks without a static index (voimain, aramidmain) leave
          # catchpoint_index_url empty and use the peer's own
          # /v2/status.last-catchpoint (already fetched into
          # /tmp/peer-status.json above), as the presets table does.
          LABEL=""
          INDEX_HTTP_CODE=""
          USE_PEER_STATUS=0
          if [ -z "$CATCHPOINT_INDEX_URL" ]; then
            USE_PEER_STATUS=1
            echo "==> no catchpoint index for $NET; using the peer's /v2/status last-catchpoint"
            CATCHPOINT_INDEX_URL="(peer /v2/status last-catchpoint)"
            LABEL="$(python3 -c 'import json; print(json.load(open("/tmp/peer-status.json")).get("last-catchpoint") or "")')"
            INDEX_HTTP_CODE="200"
            printf '%s' "$LABEL" > /tmp/catchpoint-label.txt
          else
            echo "==> discovering the latest $NET catchpoint from $CATCHPOINT_INDEX_URL"
          fi
          for attempt in 1 2 3 4 5; do
            if [ -n "$LABEL" ] || [ "$USE_PEER_STATUS" = 1 ]; then break; fi
            INDEX_HTTP_CODE="$(curl -s -o /tmp/catchpoint-label.txt -w '%{http_code}' "$CATCHPOINT_INDEX_URL")" || true
            if [ "$INDEX_HTTP_CODE" = "200" ]; then
              LABEL="$(tr -d '[:space:]' < /tmp/catchpoint-label.txt)"
              break
            fi
            echo "==> attempt $attempt: catchpoint index returned HTTP $INDEX_HTTP_CODE, retrying in 5s"
            sleep 5
          done
          if [ "$INDEX_HTTP_CODE" != "200" ] || [ -z "$LABEL" ]; then
            echo "fatal: could not fetch a catchpoint label from $CATCHPOINT_INDEX_URL (last HTTP: $INDEX_HTTP_CODE)" >&2
            echo "response body (if any):" >&2
            cat /tmp/catchpoint-label.txt >&2 2>/dev/null || true
            exit 1
          fi
          case "$LABEL" in
            *[0-9]'#'*) ;;
            *)
              echo "fatal: catchpoint index response doesn't look like <round>#<hash>: '$LABEL'" >&2
              exit 1
              ;;
          esac
          echo "==> catchpoint label: $LABEL"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

          # Found live (fifth dispatch attempt): a raw `#` in a URL is a
          # fragment delimiter, and curl (like any URL-aware client)
          # silently strips it and everything after it before the request
          # ever goes over the wire -- the node's REST endpoint only ever
          # saw "/v2/catchup/65370000", never the hash half of the label,
          # and correctly 400'd it as unparseable. Percent-encode the
          # catchpoint label's only special character (a label is always
          # <digits>#<base32 hash>, so this is the one and only `#`).
          LABEL_URLENC="${LABEL//#/%23}"
          CATCHUP_HTTP_CODE="$(curl -s -o /tmp/catchup-response.json -w '%{http_code}' -X POST \
            -H "X-Algo-API-Token: $ALGOD_TOKEN" \
            "http://127.0.0.1:8180/v2/catchup/$LABEL_URLENC")" || true
          if [ "$CATCHUP_HTTP_CODE" != "200" ] && [ "$CATCHUP_HTTP_CODE" != "201" ]; then
            echo "fatal: POST /v2/catchup/$LABEL on the node returned HTTP $CATCHUP_HTTP_CODE" >&2
            cat /tmp/catchup-response.json >&2 2>/dev/null || true
            exit 1
          fi
          cat /tmp/catchup-response.json
          echo ""
          echo "==> fast catchup requested (HTTP $CATCHUP_HTTP_CODE); the clock starts now"

      - name: Poll node + peer status and detect a halt
        id: monitor
        # Hard step-level cap so a wedged monitor/node can never hold the job
        # until the job-level timeout (which cancels the job and skips the
        # artifact-upload steps -- issue #1650's live verification lost two
        # whole dispatches' evidence that way). Must leave the later
        # `if: always()` steps (teardown, summary, upload) time to run.
        # duration_minutes is clamped to 315, so the shell cap below is at
        # most 318 min; 320 leaves room for the final cat/analyze.
        timeout-minutes: 320
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
        run: |
          set +e
          # Owned by this shell, not by python: monitor.py enforces
          # --duration-minutes itself, but a python process blocked in a
          # syscall (DNS, a wedged node) never gets to check its own clock.
          # Run it in the background and enforce a wall-clock deadline from
          # here, while emitting a heartbeat line every 60s so a run that
          # dies mid-way still leaves live evidence in the job log
          # (not only in artifacts that may never upload).
          # stdin/stdout/stderr of the child are redirected away from this
          # step's streams (see the profiling step's note on the runner-hang
          # trap); its output is replayed below.
          DURATION_MIN="${{ steps.params.outputs.duration_minutes }}"
          DEADLINE=$(( $(date +%s) + DURATION_MIN * 60 + 180 ))
          python3 ops/mainnet-soak/monitor.py collect \
            --node-url http://127.0.0.1:8180 \
            --node-token "$ALGOD_TOKEN" \
            --peer-url "$ALGOD_URL" \
            --duration-minutes "$DURATION_MIN" \
            --follow-minutes "${{ steps.params.outputs.follow_minutes }}" \
            --node-log ${ART}/node.log \
            --halt-minutes "${{ steps.params.outputs.halt_minutes }}" \
            --out ${ART}/status.jsonl \
            --json-out ${ART}/summary.json \
            </dev/null > ${ART}/monitor.out 2>&1 &
          MON_PID=$!
          CAPPED=0
          WEDGE_POLLS=0
          DUMPED=0
          NODE_PID="${{ steps.start_node.outputs.node_pid }}"
          while kill -0 "$MON_PID" 2>/dev/null; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::warning::hard wall-clock cap hit (${DURATION_MIN}m + 3m); killing monitor.py"
              kill -TERM "$MON_PID" 2>/dev/null; sleep 5; kill -KILL "$MON_PID" 2>/dev/null
              CAPPED=1
              break
            fi
            THREADS="$(ls /proc/$NODE_PID/task 2>/dev/null | wc -l)"
            TOTAL_THREADS="$(ps -eLf 2>/dev/null | wc -l)"
            LAST="$(tail -n 1 ${ART}/status.jsonl 2>/dev/null | python3 ops/mainnet-soak/heartbeat.py 2>&1)"
            echo "heartbeat $(date -u +%H:%M:%SZ) node_threads=$THREADS all_threads=$TOTAL_THREADS $LAST"
            # Issue #1650: a node that is alive but stops answering /v2/status
            # (observed live right after resuming participation) needs a
            # thread-stack dump to diagnose; take one, once, per wedge.
            case "$LAST" in
              *node_ok=False*)
                WEDGE_POLLS=$((WEDGE_POLLS + 1))
                if [ "$WEDGE_POLLS" -ge 2 ] && [ "$DUMPED" -eq 0 ] && command -v gdb >/dev/null 2>&1 && kill -0 "$NODE_PID" 2>/dev/null; then
                  DUMPED=1
                  echo "==> node wedged; dumping thread stacks to ${ART}/wedge-stacks.txt"
                  sudo timeout 240 gdb -p "$NODE_PID" -batch -ex "set pagination off" -ex "thread apply all bt 30"                     > ${ART}/wedge-stacks.txt 2>&1 </dev/null || true
                  top -H -b -n 1 -p "$NODE_PID" 2>/dev/null | head -n 25 >> ${ART}/wedge-stacks.txt
                  tail -n 5 ${ART}/wedge-stacks.txt | cut -c1-200
                fi
                ;;
              *) WEDGE_POLLS=0 ;;
            esac
            # Milestones from the node's own log (sync phases, the issue
            # #1650 fast-forward, participation restarts) as they happen.
            grep -a -E 'sync state transition|cutover (complete|finalized)|fast-forwarded acctrounds|issue #1650|consensus participation [(]re[)]started|reloaded ledger|live catchpoint catchup (completed|failed)|panicked' \
              ${ART}/node.log 2>/dev/null | sed -E 's/\x1b\[[0-9;]*m//g' | tail -n 3 | cut -c1-300
            sleep 60
          done
          wait "$MON_PID" 2>/dev/null
          RC=$?
          cat ${ART}/monitor.out 2>/dev/null
          if [ "$CAPPED" -eq 1 ]; then
            # monitor.py never got to write its verdict; derive one from the
            # partial JSONL it flushed sample-by-sample, so a capped run
            # still yields a verdict + summary instead of a silent hang.
            python3 ops/mainnet-soak/monitor.py analyze ${ART}/status.jsonl \
              --node-log ${ART}/node.log \
              --json-out ${ART}/summary.json
            RC=$?
          fi
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          set -e

      - name: Tear down the node
        if: always()
        run: |
          PID="${{ steps.start_node.outputs.node_pid }}"
          if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            sleep 2
            kill -9 "$PID" 2>/dev/null || true
          fi

          # Issue #1626: stop the resource-profiling loop so it doesn't
          # outlive the job; the log it wrote is already on disk and gets
          # picked up by the "Upload artifacts" step below regardless of
          # how this job ends.
          PROFILING_PID="${{ steps.profiling.outputs.profiling_pid }}"
          if [ -n "$PROFILING_PID" ] && kill -0 "$PROFILING_PID" 2>/dev/null; then
            kill "$PROFILING_PID" 2>/dev/null || true
          fi

      - name: Capture the halted block (if any) for offline reproduction
        if: always() && fromJSON(steps.monitor.outputs.exit_code || '0') == 1
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
        run: |
          ROUND="$(python3 -c 'import json,os; print(json.load(open(os.environ["ART"] + "/summary.json")).get("round") or "")')"
          if [ -n "$ROUND" ]; then
            echo "==> fetching round $ROUND from $ALGOD_URL for offline repro"
            curl -sf -H "X-Algo-API-Token: $ALGOD_TOKEN" "$ALGOD_URL/v2/blocks/$ROUND" \
              -o "${ART}/block-$ROUND.msgpack" || true
            curl -sf -H "X-Algo-API-Token: $ALGOD_TOKEN" "$ALGOD_URL/v2/blocks/$ROUND?format=json" \
              -o "${ART}/block-$ROUND.json" || true
          fi

      - name: Scan node.log for broken-state signatures
        id: scan
        if: always()
        run: |
          # Hard signatures (permanent block-write errors, stalled on
          # invalid block, apply_block failures, panics, ledger invariant
          # errors, shadow-execute mismatches, block-apply balance errors
          # outside the gossip tx handlers, EAGAIN, repeated ensure_block
          # no-advance) fail the job in the last step; warn and
          # noise tiers are only counted. Results are merged into
          # summary.json under "log_scan". See ops/mainnet-soak/nodelog.py.
          mkdir -p ${ART}
          set +e
          python3 ops/mainnet-soak/monitor.py scan-log ${ART}/node.log \
            --summary ${ART}/summary.json
          RC=$?
          set -e
          echo "scan_exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then
            echo "::error::node.log contains hard broken-state signatures (see the job summary)"
          fi

      - name: Write the step summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          path = os.environ["ART"] + "/summary.json"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not os.path.exists(path):
              lines = [f"# {os.environ['NET'].capitalize()} node soak", "", "No summary.json was produced (the run failed before monitoring started)."]
          else:
              with open(path) as f:
                  r = json.load(f)
              # Rendered by monitor.py (unit-tested): verdict, metrics table
              # incl. lag before the stall window, follow timing rows with
              # their baseline/restarted flags, node.log scan.
              sys.path.insert(0, "ops/mainnet-soak")
              import monitor
              lines = monitor.render_step_summary_lines(r, network=os.environ["NET"])
          text = "\n".join(lines) + "\n"
          print(text)
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(text)
          PYEOF

      - name: File (or comment on) an issue for a halt
        if: always() && fromJSON(steps.monitor.outputs.exit_code || '0') == 1
        env:
          GH_TOKEN: ${{ github.token }}
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          tail -n 100 ${ART}/node.log > ${ART}/log-excerpt.txt || true
          python3 ops/mainnet-soak/file_issue.py \
            --repo "${{ github.repository }}" \
            --verdict-json ${ART}/summary.json \
            --template ops/mainnet-soak/issue_template.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifacts-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --log-excerpt-file ${ART}/log-excerpt.txt \
            --peer-url "$ALGOD_URL" \
            --network "$NET" \
            $DRY_RUN_FLAG

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.network }}-node-soak-${{ github.run_id }}
          path: ${{ env.ART }}/
          if-no-files-found: warn

      - name: Fail the job on a halt or a monitor/self-test error
        if: always()
        run: |
          CODE="${{ steps.monitor.outputs.exit_code }}"
          SCAN="${{ steps.scan.outputs.scan_exit_code }}"
          # A hard log-scan hit fails the job regardless of the monitor
          # verdict. It does NOT file an issue: file_issue.py is built
          # around halt verdicts (round/phase dedup keys), and a scan hit
          # has neither, so the evidence lives in the job summary and the
          # uploaded node.log/summary.json instead.
          if [ -n "$SCAN" ] && [ "$SCAN" -ne 0 ]; then
            echo "::error::broken-state scan failed (exit $SCAN) -- see 'node.log broken-state scan' in the job summary" >&2
            exit 1
          fi
          if [ -z "$CODE" ]; then
            echo "monitor step never ran (an earlier step failed) — job already failed" >&2
            exit 1
          fi
          if [ "$CODE" -eq 0 ]; then
            echo "verdict: ok"
            exit 0
          elif [ "$CODE" -eq 2 ]; then
            echo "verdict: source_outage — warning only, not a job failure"
            exit 0
          else
            echo "verdict: halt (exit $CODE) — see the filed/commented issue"
            exit 1
          fi

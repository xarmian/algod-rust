name: Bench Ledger Replay

# Issue #2105 (epic #2101): the offline ledger-replay tier on Linux. Both
# go-algorand's ledger (benchmarks/go-replay) and algod-rust's production
# catchup path (`algod-rust bench replay-corpus`) replay the committed `small`
# workload corpus, and the tier fails unless both reach the same final state
# and that state matches corpus.json. The steps:
#   * gofmt / vet / go test of the go harness (its final state equals
#     benchmarks/go-replay/testdata/small-final-state.json, plus the
#     corrupted-corpus negative tests);
#   * `make bench-compare TIERS=replay CORPUS=small RUNS=3`, report.md to
#     the job summary;
#   * the gate's negative tests: the tier re-run on a corrupted copy of the
#     corpus (a flipped txn byte; a wrong expected state) must fail;
#   * issue #2119: the committed 50-round testnet prefix (real certificates)
#     replayed with certificate authentication on both sides, and the same
#     corpus with one tampered vote, which must fail on both sides.
# CI runners are noisy: the ratios are indicative only.

on:
  pull_request:
    paths:
      - "benchmarks/go-replay/**"
      - "benchmarks/corpus/**"
      # The tier and everything it imports or runs (run.py, build_both.sh,
      # micro_equiv.py, corpus/corpus_tool.py, bench_schema.py, schema/).
      - "scripts/bench/**"
      - "Makefile"
      - "bin/algod-rust/Cargo.toml"
      - "bin/algod-rust/src/main.rs"
      - "bin/algod-rust/src/cli.rs"
      - "bin/algod-rust/src/falcon_backend.rs"
      - "bin/algod-rust/src/commands/bench_replay.rs"
      - "bin/algod-rust/src/commands/participate.rs"
      - "crates/tools/algo-bench/**"
      - ".github/workflows/bench-replay.yml"
      # The production code the replay drives.
      - "crates/core/algo-ledger/**"
      - "crates/core/algo-validate/**"
      - "crates/core/algo-codec/**"
      - "crates/core/algo-types/**"
      - "crates/core/algo-avm/**"
      - "crates/core/algo-agreement/**"
      - "crates/node/algo-config/**"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "benchmarks/go-replay/**"
      - "benchmarks/corpus/**"
      # The tier and everything it imports or runs (run.py, build_both.sh,
      # micro_equiv.py, corpus/corpus_tool.py, bench_schema.py, schema/).
      - "scripts/bench/**"
      - "Makefile"
      - "bin/algod-rust/Cargo.toml"
      - "bin/algod-rust/src/main.rs"
      - "bin/algod-rust/src/cli.rs"
      - "bin/algod-rust/src/falcon_backend.rs"
      - "bin/algod-rust/src/commands/bench_replay.rs"
      - "bin/algod-rust/src/commands/participate.rs"
      - "crates/tools/algo-bench/**"
      - ".github/workflows/bench-replay.yml"
      - "crates/core/algo-ledger/**"
      - "crates/core/algo-validate/**"
      - "crates/core/algo-codec/**"
      - "crates/core/algo-types/**"
      - "crates/core/algo-avm/**"
      - "crates/core/algo-agreement/**"
      - "crates/node/algo-config/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-replay:
    name: replay tier (small corpus, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Locate the go-algorand checkout
        # `runner` is not available in job-level env; export it for every later step.
        run: |
          echo "GO_ALGORAND_DIR=$RUNNER_TEMP/go-algorand" >> "$GITHUB_ENV"
          echo "BENCH_BIN_DIR=$GITHUB_WORKSPACE/target/bench-compare" >> "$GITHUB_ENV"
      - name: Resolve the pinned tag and its go.mod
        id: pin
        run: |
          set -euo pipefail
          tag="$(grep -v '^[[:space:]]*#' scripts/bench/go-algorand.pin | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/go-algorand-gomod"
          # setup-go only parses a file literally named go.mod (else: plain version file).
          curl -fsSL "https://raw.githubusercontent.com/algorand/go-algorand/${tag}/go.mod" \
            -o "$RUNNER_TEMP/go-algorand-gomod/go.mod"
          grep -E '^(go|toolchain) ' "$RUNNER_TEMP/go-algorand-gomod/go.mod"
      - name: Install Go per go-algorand's go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ runner.temp }}/go-algorand-gomod/go.mod
          cache-dependency-path: benchmarks/go-replay/go.sum
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-replay
      - name: Install libsodium build tools
        run: |
          # go-algorand's crypto package links a vendored libsodium fork via cgo.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool build-essential
      - name: Clone pinned go-algorand + make libsodium
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$TAG" https://github.com/algorand/go-algorand "$GO_ALGORAND_DIR"
          make -C "$GO_ALGORAND_DIR" libsodium
      - name: Tier unit tests (gate, negative corpora, result rows)
        run: python3 -m unittest -v scripts/bench/test_replay.py scripts/bench/test_testnet_corpus.py
      - name: Go harness - gofmt, vet, tests
        run: |
          set -euo pipefail
          cd benchmarks/go-replay
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "::error::gofmt needed: $unformatted"; exit 1; }
          # go directive from go-replay's own go.mod, go-algorand replaced by the checkout.
          {
            grep -E '^go ' go.mod
            echo
            echo "use $PWD"
            echo
            echo "replace github.com/algorand/go-algorand => $GO_ALGORAND_DIR"
          } > "$RUNNER_TEMP/replay.go.work"
          export GOWORK="$RUNNER_TEMP/replay.go.work" GOFLAGS=-buildvcs=false
          cat "$GOWORK"
          go vet ./...
          go test -count=1 -v ./...
      - name: make bench-compare TIERS=replay CORPUS=small RUNS=3
        run: |
          set -euo pipefail
          make bench-compare TIERS=replay CORPUS=small RUNS=3 BENCH_RUN_DIR=bench-results/ci-replay \
            GO_ALGORAND_DIR="$GO_ALGORAND_DIR"
          # Every timing metric needs a Rust/Go ratio; go's write_mb may read
          # 0 on the runner and then has none (issue #2124).
          python3 scripts/bench/tiers/replay.py --check-report bench-results/ci-replay/report.json
      - name: Negative tests - a corrupted corpus fails the tier
        run: |
          set -euo pipefail
          # txn: both replays stop at the corrupted block; expected: both replay,
          # then the gate rejects the state. Each must fail for that reason.
          for kind in txn expected; do
            out="$RUNNER_TEMP/neg-$kind"
            mkdir -p "$out"
            if BENCH_REPLAY_CORRUPT="$kind" BENCH_RUNS=1 BENCH_REPLAY_WARMUP=0 BENCH_OUT="$out" \
                 BENCH_RUST_BIN_DIR="$BENCH_BIN_DIR/rust" BENCH_GO_ALGORAND_DIR="$GO_ALGORAND_DIR" \
                 python3 scripts/bench/tiers/replay.py > "$out/log.txt" 2>&1; then
              cat "$out/log.txt"
              echo "::error::the replay tier passed on a corrupted corpus ($kind)"
              exit 1
            fi
            tail -n 5 "$out/log.txt"
            # Each side must reject the corrupted corpus on its own (the tier
            # runs both even when the first one fails).
            if [ "$kind" = txn ]; then
              wants=('go replay exited 1' 'rust replay exited 1')
            else
              wants=('final-state gate FAILED' 'run 0 go: final state differs from corpus.json'                      'run 0 rust: final state differs from corpus.json')
            fi
            for want in "${wants[@]}"; do
              grep -qF "$want" "$out/log.txt" || { echo "::error::$kind: failed, but without '$want'"; exit 1; }
            done
            echo "corrupted corpus ($kind): the tier failed, as it must"
          done
      - name: make bench-compare TIERS=replay CORPUS=testnet-prefix50 (real certificates)
        run: |
          set -euo pipefail
          # Issue #2119: the committed 50-round testnet prefix has real
          # certificates, so both sides authenticate every one of them.
          make bench-compare TIERS=replay CORPUS=testnet-prefix50 RUNS=1 \
            BENCH_RUN_DIR=bench-results/ci-replay-testnet GO_ALGORAND_DIR="$GO_ALGORAND_DIR"
      - name: Negative test - a tampered vote fails certificate authentication
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/neg-vote"
          mkdir -p "$out"
          if BENCH_CORPUS=testnet-prefix50 BENCH_REPLAY_CORRUPT=vote BENCH_RUNS=1 \
               BENCH_REPLAY_WARMUP=0 BENCH_OUT="$out" \
               BENCH_RUST_BIN_DIR="$BENCH_BIN_DIR/rust" BENCH_GO_ALGORAND_DIR="$GO_ALGORAND_DIR" \
               python3 scripts/bench/tiers/replay.py > "$out/log.txt" 2>&1; then
            cat "$out/log.txt"
            echo "::error::the replay tier passed on a corpus with a tampered vote"
            exit 1
          fi
          tail -n 5 "$out/log.txt"
          # Both sides reject it on their own, and for the right reason: at
          # certificate authentication, not for any other failure.
          for want in 'go replay exited 1' 'did not authenticate block' \
                      'rust replay exited 1' 'replay stopped at round' \
                      'last authentication error'; do
            grep -qF "$want" "$out/log.txt" || { echo "::error::vote: failed, but without '$want'"; exit 1; }
          done
      - name: Report to job summary
        if: always()
        run: |
          if [ -s bench-results/ci-replay/report.md ]; then
            cat bench-results/ci-replay/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload run directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-replay-results
          path: bench-results/ci-replay
          if-no-files-found: ignore

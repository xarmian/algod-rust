name: Harness Shell Tests

# The Docker-free tests of the mixed-cluster / P2P soak harness scripts and of
# the algod image's entrypoint (issues #1956, #1984, #1987, #1991): stubbed
# `docker`/`goal`/`algod` and fake clocks, no cluster. They live in
# `make consensus-cluster-analyzer` but no other workflow ran that target, so a
# harness-script regression was only found by a nightly soak. They take
# seconds, hence no build and a path filter that keeps them off unrelated PRs.

on:
  pull_request:
    paths:
      - "ops/**"
      - "docker/algod/**"
      - "docker/Dockerfile"
      - "Makefile"
      - ".github/workflows/harness-shell-tests.yml"
      - ".github/workflows/*node-soak.yml"
      - "scripts/test_node_soak_callers.py"
  push:
    branches: [main]
    paths:
      - "ops/**"
      - "docker/algod/**"
      - "docker/Dockerfile"
      - "Makefile"
      - ".github/workflows/harness-shell-tests.yml"
      - ".github/workflows/*node-soak.yml"
      - "scripts/test_node_soak_callers.py"

permissions:
  contents: read

jobs:
  harness-shell-tests:
    name: Harness + image entrypoint shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run the Docker-free harness tests
        run: make consensus-cluster-analyzer

  node-soak-scripts:
    # Issue #2071: the network-parameterised node soak (ops/mainnet-soak/*
    # python tooling + reusable workflow/caller interface) was previously
    # only exercised inside the soak run itself.
    name: Node-soak tooling + workflow interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Soak monitor / issue-filer self-test
        run: python3 ops/mainnet-soak/monitor.py self-test
      - name: Reusable soak workflow <-> caller interface
        run: python3 scripts/test_node_soak_callers.py

name: Harness Shell Tests

# The Docker-free tests of the mixed-cluster / P2P soak harness scripts and of
# the algod image's entrypoint (issues #1956, #1984, #1987, #1991): stubbed
# `docker`/`goal`/`algod` and fake clocks, no cluster. They live in
# `make consensus-cluster-analyzer` but no other workflow ran that target, so a
# harness-script regression was only found by a nightly soak. They take
# seconds, hence no build and a path filter that keeps them off unrelated PRs.

on:
  pull_request:
    paths:
      - "ops/**"
      - "docker/algod/**"
      - "docker/Dockerfile"
      - "Makefile"
      - ".github/workflows/harness-shell-tests.yml"
      - ".github/workflows/*node-soak.yml"
      - "scripts/test_node_soak_callers.py"
      - "scripts/bench/**"
  push:
    branches: [main]
    paths:
      - "ops/**"
      - "docker/algod/**"
      - "docker/Dockerfile"
      - "Makefile"
      - ".github/workflows/harness-shell-tests.yml"
      - ".github/workflows/*node-soak.yml"
      - "scripts/test_node_soak_callers.py"
      - "scripts/bench/**"

permissions:
  contents: read

jobs:
  harness-shell-tests:
    name: Harness + image entrypoint shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run the Docker-free harness tests
        run: make consensus-cluster-analyzer

  node-soak-scripts:
    # Issue #2071: the network-parameterised node soak (ops/mainnet-soak/*
    # python tooling + reusable workflow/caller interface) was previously
    # only exercised inside the soak run itself.
    name: Node-soak tooling + workflow interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Soak monitor / issue-filer self-test
        run: python3 ops/mainnet-soak/monitor.py self-test
      - name: Reusable soak workflow <-> caller interface
        run: python3 scripts/test_node_soak_callers.py

  bench-compare-harness:
    # Issue #2102 (epic #2101): the Go vs Rust bench-compare harness
    # (scripts/bench/). Unit tests for the schema, report maths and
    # fingerprint parsers, then the built-in selftest tier end to end via the
    # real `make bench-compare` entry point. No builds, no Docker.
    name: bench-compare harness tests + selftest tier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Harness unit tests
        run: make bench-compare-test
      - name: build_both.sh syntax
        run: bash -n scripts/bench/build_both.sh
      - name: make bench-compare TIERS=selftest
        run: |
          make bench-compare TIERS=selftest RUNS=6 BENCH_RUN_DIR=bench-results/ci-selftest
          test -s bench-results/ci-selftest/report.json
          test -s bench-results/ci-selftest/report.md
          cat bench-results/ci-selftest/report.md >> "$GITHUB_STEP_SUMMARY"

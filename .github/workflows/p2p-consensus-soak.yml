name: Nightly P2P Consensus Soak

# Issue #594 — the P2P-transport analogue of consensus-cluster.yml's
# nightly WS-gossip mixed-cluster soak, for ops/mixed-cluster-p2p/ (3
# go-algorand v5.0.0-stable nodes in plain P2P mode, chain-bootstrapped
# 1 <- 2 <- 3, + 1 `algod-rust participate --enable-p2p` P2pOnly
# stake-holding node). Issue #591 (PR #593) fixed the P2P block/cert
# catch-up fetch path and, with it, live-verified the 4-node cluster
# sustaining 30+ rounds in lockstep over the libp2p transport alone
# (`/algorand-ws/2.2.0` raw stream for AV/PP/VB, gossipsub for TX) — see
# ops/mixed-cluster-p2p/scripts/consensus-round-trip.sh. This workflow
# adds a nightly >= 200-round soak on top of that, mirroring
# consensus-cluster.yml's tiered structure. See
# docs/P2P_SOAK_METHODOLOGY.md for what's the same / different versus
# the WS-gossip harness's own nightly job.
#
# ## Why this is NOT on the PR path
#
# Same reasoning as consensus-cluster.yml and p2p-interop.yml: a release
# build of algod-rust in Docker, three `algorand/algod:5.0.0-stable`
# pulls, a 4-node P2P-mode cluster boot (chain-bootstrapped, so each Go
# node's start depends on scraping the previous one's PeerId), and a
# multi-hundred-round soak at ~3-4.5s block time is tens of minutes —
# far too much per PR. `schedule` + `workflow_dispatch` ONLY: no
# `pull_request`, no `push`. Per-PR CI wall time is unchanged by this
# file.
#
# ## Tiers
#
#   Tier 1 (always) — `p2p-interop-up` -> `p2p-interop-status` (lockstep
#     gate, retried) -> `p2p-interop-consensus-test` (issue #589's
#     30-round consensus round-trip smoke) -> `p2p-interop-down`.
#   Tier 2 (nightly / dispatch with tier=full) —
#     `p2p-interop-soak-test ROUNDS=<input, default 200>
#     VERIFY_STAGE=1 RESTART_SCENARIOS=1 NEGATIVE_CASES=1` (issue #594 soak
#     + issue #596's fork-detector / bidirectional cert cross-verify /
#     restart-rejoin stages + issue #597's negative-conformance stage),
#     uploading summary.json, soak.jsonl, analyze.summary.json,
#     verify.log + verify-go-report-*.json, the restart/ sub-summary, the
#     negative/ sub-summary, and the per-node container logs.
#
# ## Coverage (see docs/P2P_SOAK_METHODOLOGY.md "Not yet covered")
#
# As of issue #597 this workflow's Tier 2 now matches
# consensus-cluster.yml's Tier 2 stage-for-stage: fork detection,
# bidirectional cert cross-verify, restart/rejoin, AND negative
# conformance (malformed-message injection over this harness's libp2p
# `/algorand-ws/2.2.0` raw stream, via `algo-agreement-fuzz --transport
# p2p`) all run nightly.
#
# ## Caching
#
#   * `algod-rust-p2pinterop:local` is pre-built here with a buildx
#     `type=gha` layer cache and consumed by start.sh via
#     P2PINTEROP_SKIP_BUILD=1, so the release compile is paid once per
#     Dockerfile/source change rather than on every `up` (twice per run,
#     once per tier).
#   * The Docker volume holding `tools/cert-authenticate`'s in-container
#     go-algorand clone AND its built libsodium is tarred into
#     actions/cache under its own key (`certauth-libsodium-p2p-*`, distinct
#     from consensus-cluster.yml's `certauth-libsodium-*` — two nightly
#     jobs writing the same cache key would race), same pattern as
#     consensus-cluster.yml's own Tier 2.

on:
  schedule:
    # 03:50 UTC daily — after consensus-cluster.yml's 02:41 and
    # p2p-interop.yml's 03:05, so the three nightly Docker-heavy jobs
    # don't contend for the same runner.
    - cron: "50 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        type: choice
        options: [full, smoke]
        default: full
      rounds:
        description: "Tier-2 soak length in rounds"
        default: "200"
        required: false

concurrency:
  # Never run two P2P clusters at once: they'd collide on host ports
  # 5001-5004/5161-5163 if they ever land on the same runner.
  group: p2p-consensus-soak
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same pin as the rest of the repo (see CLAUDE.md, consensus-cluster.yml).
  GO_ALGORAND_REV: "v5.0.0-stable"
  # start.sh: reuse the image built by the buildx step below.
  P2PINTEROP_SKIP_BUILD: "1"
  # Named volume run-in-docker.sh keeps its go-algorand clone + libsodium
  # build in. MUST match run-in-docker.sh's own SRC_VOLUME default
  # (tools/cert-authenticate/run-in-docker.sh) since verify-soak.sh
  # invokes it without an explicit SRC_VOLUME override — same value
  # consensus-cluster.yml uses. This is safe to share: each workflow run
  # gets its own ephemeral runner/Docker daemon, so there is no
  # cross-workflow collision on the volume itself; only the
  # actions/cache KEY below needs to be distinct per workflow.
  CERT_AUTH_VOLUME: algod-rust-goalgo-src

jobs:
  p2p-consensus-soak:
    name: P2P mixed-cluster consensus soak (3 Go P2P + 1 Rust P2pOnly)
    runs-on: ubuntu-latest
    # Tier 1 is a few minutes (cluster boot + 30-round smoke); Tier 2's
    # 200-round soak plus the #596 verify (incl. the libsodium build on a
    # cache miss) and restart stages is the bulk of the rest. 120 min
    # (bumped from 90 when #596 added those stages) is a hard stop so a
    # wedged cluster can't hold a runner all day.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: p2p-consensus-soak
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull algorand/algod:5.0.0-stable
        run: docker pull algorand/algod:5.0.0-stable

      # Deterministic tag declared by
      # ops/mixed-cluster-p2p/docker-compose.yml's `rust-node-4.image`.
      # With P2PINTEROP_SKIP_BUILD=1 start.sh runs
      # `docker compose up -d rust-node-4` (no --build) and picks this up.
      - name: Build algod-rust node image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: algod-rust-p2pinterop:local
          load: true
          cache-from: type=gha,scope=p2p-consensus-soak
          cache-to: type=gha,mode=max,scope=p2p-consensus-soak

      # ── Tier 1 — consensus round-trip smoke (#589) ───────────────────
      #
      # SKIP_START=1 / KEEP_CLUSTER=1 make the smoke run against the
      # cluster `p2p-interop-up` just started rather than cycling it a
      # second time; the explicit `-down` below is the up -> status ->
      # smoke -> down sequence.
      - name: Tier 1 — cluster up
        run: make p2p-interop-up

      # status.sh is a lockstep gate (fails when any node lags more than
      # LAG_TOLERANCE=5 rounds behind the max), and `up` returns as soon
      # as rust-node-4's container is started — before it has caught up
      # on the handful of rounds the Go nodes produced while start.sh was
      # scraping PeerIds and reading the genesis hash. Retry for up to
      # 5 min so the gate measures steady-state lockstep, not boot
      # ordering; the last invocation is the one that decides the step.
      - name: Tier 1 — cluster status (lockstep gate)
        run: |
          for _ in $(seq 1 29); do
            if make p2p-interop-status; then exit 0; fi
            sleep 10
          done
          make p2p-interop-status

      - name: Tier 1 — consensus round-trip smoke (#589)
        env:
          SKIP_START: "1"
          KEEP_CLUSTER: "1"
          ROUNDS: "30"
        run: make p2p-interop-consensus-test

      - name: Tier 1 — cluster down
        run: make p2p-interop-down

      # ── Tier 2 prerequisites — go-algorand + libsodium caches ─────────
      # Same rationale as consensus-cluster.yml's own copy of these
      # steps: run-in-docker.sh needs a real go-algorand git checkout to
      # clone from (a runner has no sibling ../go-algorand), and the
      # expensive `make libsodium` autotools build is cached across
      # nightly runs via the tarred Docker volume below.
      - name: Clone pinned go-algorand
        if: github.event.inputs.tier != 'smoke'
        env:
          GO_ALGORAND_DIR: ${{ runner.temp }}/go-algorand-src
        run: |
          set -euo pipefail
          rm -rf "$GO_ALGORAND_DIR"
          git clone --branch "$GO_ALGORAND_REV" \
            https://github.com/algorand/go-algorand.git "$GO_ALGORAND_DIR"

      - name: Restore cert-authenticate libsodium volume
        id: certauth-vol
        if: github.event.inputs.tier != 'smoke'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/certauth-volume
          # Distinct key from consensus-cluster.yml's own
          # (`certauth-libsodium-${GO_ALGORAND_REV}-...`) — a separate
          # actions/cache entry per workflow, even though the underlying
          # Docker volume NAME (CERT_AUTH_VOLUME above) is shared, since
          # each is restored into its own ephemeral runner.
          key: certauth-libsodium-p2p-${{ env.GO_ALGORAND_REV }}-${{ hashFiles('tools/cert-authenticate/run-in-docker.sh') }}

      - name: Load cert-authenticate volume from cache
        if: github.event.inputs.tier != 'smoke'
        run: |
          set -euo pipefail
          docker volume create "$CERT_AUTH_VOLUME" >/dev/null
          if [ -f "$RUNNER_TEMP/certauth-volume/work.tar" ]; then
            echo "==> restoring cached go-algorand clone + libsodium build"
            docker run --rm \
              -v "$CERT_AUTH_VOLUME:/work" \
              -v "$RUNNER_TEMP/certauth-volume:/backup:ro" \
              alpine tar -xf /backup/work.tar -C /work
          else
            echo "==> no cached volume; run-in-docker.sh will run 'make libsodium' (3-5 min)"
          fi

      # ── Tier 2 — full soak + #596 verify/restart stages ───────────────
      #
      # OUT_DIR is read straight from the environment by
      # consensus-soak.sh, pinning the otherwise timestamped artifact
      # directory to a path the upload step can name. VERIFY_STAGE=1
      # RESTART_SCENARIOS=1 turn on issue #596's fork-detector /
      # bidirectional cert cross-verify / restart-rejoin stages on top of
      # issue #594's soak, and NEGATIVE_CASES=1 turns on issue #597's
      # malformed-message injection stage — the P2P-harness analogue of
      # consensus-cluster.yml's Tier 2 `RESTART_SCENARIOS=1
      # NEGATIVE_CASES=1`.
      - name: Tier 2 — P2P consensus soak + verify + restart + negative (#594 + #596 + #597)
        if: github.event.inputs.tier != 'smoke'
        env:
          OUT_DIR: ${{ github.workspace }}/p2p-soak-artifacts
          ROUNDS: ${{ github.event.inputs.rounds || '200' }}
          VERIFY_STAGE: "1"
          RESTART_SCENARIOS: "1"
          NEGATIVE_CASES: "1"
        run: make p2p-interop-soak-test

      # ── Diagnostics + artifacts ───────────────────────────────────────
      - name: Collect container logs on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/p2p-soak-artifacts/container-logs"
          for c in p2pinterop-go-node-1 p2pinterop-go-node-2 p2pinterop-go-node-3 p2pinterop-rust-node-4; do
            docker logs --tail 2000 "$c" \
              > "$GITHUB_WORKSPACE/p2p-soak-artifacts/container-logs/$c.log" 2>&1
          done
          docker ps -a > "$GITHUB_WORKSPACE/p2p-soak-artifacts/container-logs/docker-ps.txt" 2>&1
          exit 0

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # summary.json, soak.jsonl, analyze.summary.json, analyze.log,
          # verify.log + verify-go-report-*.json (#596 cert authenticate),
          # cert-crossverify JSONL, the restart/ sub-summary, the
          # negative/ sub-summary (#597), and the per-node logs the
          # analyzers read.
          name: p2p-consensus-soak-${{ github.run_id }}
          path: p2p-soak-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Export cert-authenticate volume for the cache
        if: always() && github.event.inputs.tier != 'smoke' && steps.certauth-vol.outputs.cache-hit != 'true'
        run: |
          set +e
          # Only cache a volume that actually holds a built libsodium —
          # otherwise a job that failed before the verifier ran would
          # poison this cache key with an empty tarball.
          docker run --rm -v "$CERT_AUTH_VOLUME:/work:ro" alpine \
            test -f /work/go-algorand/crypto/libs/linux/amd64/lib/libsodium.a
          if [ $? -ne 0 ]; then
            echo "==> volume has no libsodium build — not caching"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/certauth-volume"
          docker run --rm \
            -v "$CERT_AUTH_VOLUME:/work:ro" \
            -v "$RUNNER_TEMP/certauth-volume:/backup" \
            alpine tar -cf /backup/work.tar -C /work .
          exit 0

      - name: Tear down (safety net)
        if: always()
        run: make p2p-interop-down PURGE=1 || true

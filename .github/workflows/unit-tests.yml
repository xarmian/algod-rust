name: Unit Tests

# Issue #1750 (epic #1680): run the workspace unit/integration tests on every
# PR and on push to main. Before this, only the daily Coverage workflow ran
# them, so a failing algo-types unit test merged in #1747 (see #1748).
#
# Deliberately not path-filtered (like msrv.yml): the check always reports, so
# it can be made a required check without docs-only PRs waiting on a workflow
# that never starts. A warm rust-cache keeps a docs-only run to a few minutes.
#
# Scope matches coverage.yml: `cargo nextest run --workspace` default targets
# (nextest does not run doctests; see the separate doctest step). Docker-backed
# e2e suites are feature/env-gated and stay out. Flaky-test handling lives in
# .config/nextest.toml (`ci` profile: retries, never skips).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Smaller debug info = faster compile/link; backtraces still have symbols.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  unit-tests:
    name: Workspace unit tests (nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The real-thread multi-node agreement binaries are excluded here only:
      # in an unoptimized (debug) build they take well over 30 minutes on a
      # 4-core runner (a first all-in run hit the 40 min timeout with
      # service_multi_node_test tests running 17+ min each), and they are
      # load/timing-sensitive (#1693, #1695). They still run, in release with
      # retries, in the daily Coverage workflow (cargo llvm-cov nextest
      # --workspace --release). Everything else, including every other
      # algo-agreement test, runs per PR. Tracked in #1750; re-enable once a
      # fast/deterministic harness exists (#1695).
      - name: Run workspace tests
        run: >-
          cargo nextest run --workspace --profile ci
          -E 'not (binary(service_multi_node_test) | binary(player_real_harness_test))'

      # nextest skips doctests. Run them for the whole workspace; the
      # algo-network peer_features doctest failure seen on Windows dev
      # machines is a noexec-tmp local issue and does not occur on Linux CI.
      - name: Run workspace doctests
        run: cargo test --workspace --doc

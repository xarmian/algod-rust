name: Bench Localnet Smoke

# Issue #2106 (epic #2101): the homogeneous localnet throughput tier. This is a
# SMOKE of the tier, not a benchmark: 1 run, 200 deterministic transactions
# and one 10 s ladder step at 50 TPS on an all-Go and then an all-Rust
# 1 relay + 4 participation-node cluster (1 CPU / 2 GB per container). It
# proves the tier (which pulls the pinned algod image itself) still builds both clusters, drives them with one generator,
# and passes the same-txid-set gate. Shared runners are far too noisy for the
# Rust/Go ratios to mean anything; the full ladder is a manual
# `make bench-compare TIERS=localnet` on a quiet host (docs/BENCHMARK_COMPARISON.md).

on:
  pull_request:
    paths:
      - "scripts/bench/localnet_lib.py"
      - "scripts/bench/tiers/localnet.py"
      - "scripts/bench/test_localnet.py"
      - "scripts/bench/testdata/localnet/**"
      - "scripts/bench/run.py"
      - "scripts/bench/report.py"
      - "scripts/bench/go-algorand.pin"
      - "docker/scripts/stress-bootstrap.sh"
      - "bin/algod-rust/src/commands/loadgen.rs"
      - "bin/algod-rust/src/cli.rs"
      - "docker/Dockerfile"
      - "Makefile"
      - ".github/workflows/bench-localnet.yml"
  push:
    branches: [main]
    paths:
      - "scripts/bench/localnet_lib.py"
      - "scripts/bench/tiers/localnet.py"
      - "scripts/bench/test_localnet.py"
      - "scripts/bench/testdata/localnet/**"
      - "scripts/bench/run.py"
      - "scripts/bench/report.py"
      - "scripts/bench/go-algorand.pin"
      - "docker/scripts/stress-bootstrap.sh"
      - "bin/algod-rust/src/commands/loadgen.rs"
      - "bin/algod-rust/src/cli.rs"
      - "docker/Dockerfile"
      - "Makefile"
      - ".github/workflows/bench-localnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-localnet:
    name: localnet tier smoke (all-Go vs all-Rust, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (topology, aggregation, gate, rows)
        run: python3 -m unittest -v scripts/bench/test_localnet.py scripts/bench/test_run.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the algod-rust node image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: algod-rust:bench-localnet
          load: true
          cache-from: type=gha,scope=bench-localnet
          cache-to: type=gha,mode=max,scope=bench-localnet
      - name: make bench-compare TIERS=localnet (smoke profile)
        env:
          BENCH_LOCALNET_PROFILE: smoke
          BENCH_LOCALNET_CPUS: "1"
          BENCH_LOCALNET_MEM: 2g
          BENCH_LOCALNET_RUST_IMAGE: algod-rust:bench-localnet
        run: |
          set -euo pipefail
          make bench-compare TIERS=localnet RUNS=1 BENCH_RUN_DIR=bench-results/ci-localnet
          # The gate passed (the tier exited 0) and the fixed step has a Rust/Go ratio.
          python3 scripts/bench/tiers/localnet.py --check-report bench-results/ci-localnet/report.json
      - name: Report to job summary
        if: always()
        run: |
          if [ -s bench-results/ci-localnet/report.md ]; then
            cat bench-results/ci-localnet/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload run directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-localnet-results
          path: bench-results/ci-localnet
          if-no-files-found: ignore

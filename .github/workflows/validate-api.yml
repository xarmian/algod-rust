name: Dual-Node REST Conformance

# Live conformance check for issue #129: boots a real go-algorand
# v5.0.2-stable node and a real algod-rust node from the *same* baked
# genesis (docker/localnet-rust/data/, see
# docker/docker-compose.validate-api.yml's header comment), and diffs live
# HTTP responses byte-for-byte where a shared genesis makes that meaningful.
#
# Invariant: this job runs unless the change is docs/tooling only. Every
# other input (crate sources, manifests, build scripts, C sources, toolchain
# and cargo config, bundled resources, docker, tests) can change what a node
# produces, stores or serves, so the filter is "everything except" an
# allow-list of inert paths rather than an include-list that can go stale.
# The pull_request and push lists below are duplicated: keep them in sync.
# Also dispatchable manually.
#
# No go-algorand-from-source build is needed here (unlike algokey-e2e.yml)
# -- the go side uses the prebuilt `algorand/algod` image directly, and
# algod-rust runs natively (a single
# `cargo build --release`, reused by the test binary) rather than as a
# second Docker image -- see docker-compose.validate-api.yml's header
# comment for why building it twice blew the original timeout.

on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!ops/**"
      - "!scripts/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!crates/**/benches/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!ops/**"
      - "!scripts/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!crates/**/benches/**"
  workflow_dispatch:

concurrency:
  group: validate-api-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  validate-api:
    name: Live parity vs go-algorand (shared genesis)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: validate-api
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run dual-node parity suite
        run: make validate-api

      - name: Dump node logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.validate-api.yml logs --tail=200 || true

      - name: Tear down (safety net)
        if: always()
        run: make validate-api-down || true

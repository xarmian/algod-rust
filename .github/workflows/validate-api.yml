name: Dual-Node REST Conformance

# Live conformance check for issue #129: boots a real go-algorand
# v5.0.2-stable node and a real algod-rust node from the *same* baked
# genesis (docker/localnet-rust/data/, see
# docker/docker-compose.validate-api.yml's header comment), and diffs live
# HTTP responses byte-for-byte where a shared genesis makes that meaningful.
#
# Invariant: this job must run for any change that can alter block
# production, storage encoding or REST output. The filters therefore cover
# the source, manifests and build scripts of every consensus and REST crate
# (crates/**/Cargo.toml, build.rs, src/**) and everything in the REST crate
# (including its resources), plus bin/** (which holds this job's own tests,
# bin/algod-rust/tests), docker/**, the root manifests and the Makefile. It
# deliberately skips the unit/integration tests and benches of the other
# crates, which cannot change what a node produces or serves. Also
# dispatchable manually.
#
# No go-algorand-from-source build is needed here (unlike algokey-e2e.yml)
# -- the go side uses the prebuilt `algorand/algod` image directly, and
# algod-rust runs natively (a single
# `cargo build --release`, reused by the test binary) rather than as a
# second Docker image -- see docker-compose.validate-api.yml's header
# comment for why building it twice blew the original timeout.

on:
  pull_request:
    paths:
      - "crates/**/Cargo.toml"
      - "crates/**/build.rs"
      - "crates/core/**/src/**"
      - "crates/node/**/src/**"
      - "crates/node/algo-rest-api/**"
      - "bin/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "Makefile"
      - ".github/workflows/validate-api.yml"
  push:
    branches: [main]
    paths:
      - "crates/**/Cargo.toml"
      - "crates/**/build.rs"
      - "crates/core/**/src/**"
      - "crates/node/**/src/**"
      - "crates/node/algo-rest-api/**"
      - "bin/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "Makefile"
      - ".github/workflows/validate-api.yml"
  workflow_dispatch:

concurrency:
  group: validate-api-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  validate-api:
    name: Live parity vs go-algorand (shared genesis)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: validate-api
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run dual-node parity suite
        run: make validate-api

      - name: Dump node logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.validate-api.yml logs --tail=200 || true

      - name: Tear down (safety net)
        if: always()
        run: make validate-api-down || true

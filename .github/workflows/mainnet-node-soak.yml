name: Nightly Mainnet Node Soak

# Issue #1598 — a single algod-rust node, configured exactly as an
# operator would run it (`participate --network mainnet`), bootstrapped
# with fast catchup against a real mainnet relay/archival endpoint, run
# directly on the GitHub-hosted runner (no cluster, no Docker harness).
# Measures how long fast catchup actually takes on a CI runner, and
# detects the node halting — either mid-catchup or after it reaches the
# tip — auto-filing a GitHub issue when it does.
#
# This is a NEW, STANDALONE workflow. It does not modify, extend, or
# share state with any existing workflow (consensus-cluster.yml,
# p2p-consensus-soak.yml, validate-api.yml, nightly-fuzz.yml, …) — see
# issue #1598's "Scope" section.
#
# ## Why this is NOT on the PR path
#
# A release build plus up to an hour of real mainnet fast catchup is far
# too much per PR, and it depends on a live, third-party public endpoint
# a PR run should never be gated on. `schedule` + `workflow_dispatch`
# ONLY: no `pull_request`, no `push`.
#
# ## What runs
#
#   1. Release-build `algod-rust`.
#   2. Self-test `ops/mainnet-soak/monitor.py` and `file_issue.py` — the
#      verdict logic is trusted only once its own tests pass, same
#      discipline `ops/mixed-cluster/scripts/consensus-soak.sh` applies to
#      `analyze.py`.
#   3. Start `algod-rust participate --network mainnet` as a fresh,
#      zero-stake, outbound-only participation node (real mainnet DNS
#      relay discovery, no inbound listener needed for this soak).
#   4. Discover the latest mainnet catchpoint from the catchup peer's own
#      `/v2/status` `last-catchpoint`, then `POST /v2/catchup/{label}` on
#      the node — the same fast-catchup path `goal node catchup` drives.
#   5. Poll both the node's and the peer's `/v2/status` every 10s for the
#      run's time budget, via `monitor.py collect` (which also stops the
#      run early the moment a halt is detected, rather than burning the
#      rest of the budget).
#   6. Tear the node down, print the step-summary table, upload
#      artifacts, and — only on a verdict of `stuck`/`node_failure` — file
#      (or comment on, if a dedup match exists) a GitHub issue via
#      `file_issue.py`.
#
# A `source_outage` verdict (the catchup peer itself unreachable or not
# advancing) is a warning only and never files an issue — see
# `ops/mainnet-soak/monitor.py`'s module doc comment for the full verdict
# taxonomy and why.

on:
  schedule:
    # 04:20 UTC daily — after the other three nightly Docker-heavy jobs
    # (consensus-cluster.yml 02:41, p2p-interop.yml 03:05,
    # p2p-consensus-soak.yml 03:50) so this doesn't contend with them for
    # a runner slot, though it needs none of their Docker/cluster state.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Total run budget in minutes"
        default: "60"
        required: false
      algod_url:
        description: "Catchup peer REST URL override (default: the mainnet preset / MAINNET_ALGOD_URL variable)"
        required: false
      halt_minutes:
        description: "Minutes of no progress before a halt is declared"
        default: "5"
        required: false
      dry_run_issues:
        description: "Print the would-be issue instead of filing it"
        type: boolean
        default: true

concurrency:
  # One mainnet soak node at a time — no reason to ever run two, and it
  # keeps the auto-issue dedup search meaningful within a single run.
  group: mainnet-node-soak
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ALGOD_TOKEN: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

jobs:
  mainnet-node-soak:
    name: Mainnet participation-node soak (fast catchup + halt detection)
    runs-on: ubuntu-latest
    # duration_minutes (default 60) plus build/catchup-discovery/teardown
    # overhead — a hard stop so a wedged node can't hold a runner all day.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mainnet-node-soak
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Self-test the monitor/issue-filer before trusting them
        run: python3 ops/mainnet-soak/monitor.py self-test

      - name: Build algod-rust (release)
        run: cargo build --release --bin algod-rust

      - name: Resolve run parameters
        id: params
        run: |
          DURATION_MINUTES="${{ github.event.inputs.duration_minutes || '60' }}"
          HALT_MINUTES="${{ github.event.inputs.halt_minutes || '5' }}"
          DRY_RUN="${{ github.event.inputs.dry_run_issues }}"
          # workflow_dispatch's boolean input renders as the string "true"/
          # "false"; a schedule run has no inputs at all (empty string) and
          # must default to a REAL (non-dry-run) filing — dry-run is only
          # ever the manual-testing default, never the nightly behavior.
          if [ -z "$DRY_RUN" ]; then DRY_RUN="false"; fi
          ALGOD_URL="${{ github.event.inputs.algod_url }}"
          if [ -z "$ALGOD_URL" ]; then
            ALGOD_URL="${{ vars.MAINNET_ALGOD_URL || 'https://mainnet-api.4160.nodely.dev' }}"
          fi
          echo "duration_minutes=$DURATION_MINUTES" >> "$GITHUB_OUTPUT"
          echo "halt_minutes=$HALT_MINUTES" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "algod_url=$ALGOD_URL" >> "$GITHUB_OUTPUT"
          echo "Run parameters: duration=${DURATION_MINUTES}m halt=${HALT_MINUTES}m dry_run=${DRY_RUN} peer=${ALGOD_URL}"

      - name: Discover a real catchpoint-file-serving relay
        id: relay
        run: |
          set -uo pipefail

          # Issue #1598 (found live, sixth dispatch attempt): the
          # documented --algod-url default (mainnet-api.4160.nodely.dev,
          # steps.params.outputs.algod_url) is a third-party REST GATEWAY
          # -- it serves the wallet-facing /v2/... API but 404s on the
          # internal /v1/{genesisID}/ledger/{round} ledger/catchpoint-file
          # service (confirmed live: "sync state transition ... to=Failed:
          # not found: catchpoint GET /v1/mainnet-v1.0/ledger/12x3tc").
          # go-algorand's own CatchpointCatchupService
          # (catchup/catchpointService.go) never asks an arbitrary REST
          # peer for this either -- it downloads over the gossip network
          # from a real, gossip-connected relay. algod-rust's
          # --catchup-peer (issue #940) is a REST-only simplification of
          # that, so it needs a REST URL pointed at an actual relay --
          # confirmed live (plain curl, no algod-rust involved) that a
          # real DNS-discovered mainnet relay serves this same ledger
          # path directly over plain HTTP GET on its gossip port (4160),
          # streaming real catchpoint data.
          #
          # Discover one the same way the node itself does: an SRV lookup
          # for _algobootstrap._tcp.mainnet.algorand.network (the same
          # service name algo_network::discovery queries, dns_bootstrap_id
          # template "<network>.algorand.network" mirroring go's DNS
          # bootstrap), then confirm the candidate actually answers on
          # its gossip port before committing to it as --catchup-peer.
          if ! command -v dig >/dev/null 2>&1; then
            echo "fatal: dig is not available on this runner -- cannot resolve mainnet relay SRV records" >&2
            exit 1
          fi

          mapfile -t SRV_RECORDS < <(dig +short SRV _algobootstrap._tcp.mainnet.algorand.network 2>/dev/null)
          if [ "${#SRV_RECORDS[@]}" -eq 0 ]; then
            echo "fatal: SRV lookup for _algobootstrap._tcp.mainnet.algorand.network returned nothing" >&2
            exit 1
          fi
          echo "==> ${#SRV_RECORDS[@]} candidate relay(s) from SRV lookup"

          RELAY_URL=""
          for record in "${SRV_RECORDS[@]}"; do
            # SRV record format: <priority> <weight> <port> <target.>
            PORT="$(printf '%s' "$record" | awk '{print $3}')"
            TARGET="$(printf '%s' "$record" | awk '{print $4}' | sed 's/\.$//')"
            if [ -z "$PORT" ] || [ -z "$TARGET" ]; then
              continue
            fi
            CANDIDATE="http://$TARGET:$PORT"
            HTTP_CODE="$(curl -s -m 10 -o /dev/null -w '%{http_code}' "$CANDIDATE/v2/status")"
            echo "==> trying $CANDIDATE (status endpoint HTTP $HTTP_CODE)"
            if [ "$HTTP_CODE" != "000" ]; then
              # Any real HTTP response (even a 4xx from a relay that
              # doesn't serve /v2/status the way a REST gateway does)
              # proves this is a live, reachable HTTP server on this
              # port -- unlike a REST-gateway-only endpoint, a real
              # relay's own catchpoint-file path is what actually
              # matters and is confirmed separately below.
              RELAY_URL="$CANDIDATE"
              break
            fi
          done
          if [ -z "$RELAY_URL" ]; then
            echo "fatal: none of the ${#SRV_RECORDS[@]} candidate relays answered over HTTP" >&2
            exit 1
          fi
          echo "==> selected catchup peer: $RELAY_URL"
          echo "catchup_peer_url=$RELAY_URL" >> "$GITHUB_OUTPUT"

      - name: Start the mainnet participation node
        id: start_node
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
          CATCHUP_PEER_URL: ${{ steps.relay.outputs.catchup_peer_url }}
        run: |
          set -euo pipefail
          mkdir -p mainnet-soak-artifacts
          mkdir -p /tmp/mainnet-soak-ledger /tmp/mainnet-soak-partkeys /tmp/mainnet-soak-data

          # Without --data-dir the REST server generates a random ephemeral
          # token we'd never see, and every curl call below would 401 --
          # seed known algod.token/algod.admin.token files instead, the
          # same pattern ops/mixed-cluster-p2p/scripts/start.sh uses.
          printf '%s' "$ALGOD_TOKEN" > /tmp/mainnet-soak-data/algod.token
          printf '%s' "$ALGOD_TOKEN" > /tmp/mainnet-soak-data/algod.admin.token

          # Issue #1600: real mainnet DNS-SRV bootstrap discovery hits
          # hickory-resolver's DNSSEC validator ("exceeded max validation
          # depth") against mainnet.algorand.network's real DNSSEC chain,
          # found live by this workflow's own first dispatch run --
          # unrelated to this soak's actual purpose and not yet root-caused
          # (tracked separately, see #1600). DNSSecurityFlags=0 clears the
          # DNS_SECURITY_SRV bit (config/algo_config's dns_security_flags,
          # mirroring go's DNSSecuritySRVEnforced()) for THIS soak node
          # only -- go-algorand's own real default (enforced) is untouched,
          # and this is data (config.json), not a code change to the node.
          #
          # "Version" must be pinned to algo_config::LATEST_VERSION (found
          # live, second dispatch attempt): Local::migrate() walks a config
          # with no "Version" field (defaults to 0) forward through every
          # versioned-default table, and DNS_SECURITY_FLAGS's own table
          # (VersionedDefault::new(&[(6, || 1), (34, || 9)])) defaults to 0
          # below version 6 -- migrate_field() only preserves a field whose
          # CURRENT value differs from "the default AT THE VERSION IT'S
          # CURRENTLY AT", so an explicit 0 with no Version looks identical
          # to "never touched, still at the version-0 default" and gets
          # silently migrated all the way back up to the enforced default.
          # Pinning Version to LATEST_VERSION short-circuits the migration
          # loop (`while self.version < LATEST_VERSION`) entirely, so this
          # explicit override survives. LATEST_VERSION is 38 as of this
          # comment (crates/node/algo-config/src/lib.rs) -- update this if
          # that constant changes, though by the time it does #1600 should
          # have removed this whole workaround anyway.
          # Revert once #1600 lands a real fix.
          echo '{"Version": 38, "DNSSecurityFlags": 0}' > /tmp/mainnet-soak-data/config.json

          # Real mainnet genesis — the same fixture `make replay-mainnet*`
          # already uses against a live archival node. A fresh, empty
          # participation-key store is intentional: this soak proves the
          # node runs, gossips, and catches up, not that it votes (zero
          # stake, matching every other read-only/observer node this repo
          # already runs in CI).
          ./target/release/algod-rust participate \
            --network mainnet \
            --genesis-id mainnet-v1.0 \
            --genesis-json crates/core/algo-ledger/tests/fixtures/mainnet-genesis.json \
            --genesis-path crates/core/algo-ledger/tests/fixtures/mainnet-genesis.json \
            --ledger-path /tmp/mainnet-soak-ledger/ledger \
            --partkey-path /tmp/mainnet-soak-partkeys/partkeys.sqlite \
            --data-dir /tmp/mainnet-soak-data \
            --rest-listen 127.0.0.1:8180 \
            --catchup-peer "$CATCHUP_PEER_URL" \
            --catchup-peer-token "" \
            > mainnet-soak-artifacts/node.log 2>&1 &
          echo "node_pid=$!" >> "$GITHUB_OUTPUT"

          echo "==> waiting for the node's REST API"
          for _ in $(seq 1 60); do
            if curl -sf -H "X-Algo-API-Token: $ALGOD_TOKEN" http://127.0.0.1:8180/v2/status >/dev/null 2>&1; then
              echo "node is serving /v2/status"
              exit 0
            fi
            sleep 2
          done
          echo "fatal: node never answered /v2/status" >&2
          tail -n 200 mainnet-soak-artifacts/node.log >&2 || true
          exit 1

      - name: Start fast catchup
        id: catchup
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
        run: |
          set -uo pipefail

          # A silent `curl | python3` pipeline under `set -e` gives no
          # diagnostic at all when either side fails (found live, third
          # dispatch attempt: the step died with no message right after
          # this echo). Every stage below is checked and diagnosed on its
          # own, so a repeat is actually debuggable from the log alone --
          # retry a few times first, since a public third-party endpoint
          # returning a transient 429/5xx is not the same class of
          # problem as it being genuinely unreachable.

          echo "==> checking the catchup peer's own /v2/status ($ALGOD_URL)"
          PEER_HTTP_CODE=""
          for attempt in 1 2 3 4 5; do
            PEER_HTTP_CODE="$(curl -s -o /tmp/peer-status.json -w '%{http_code}' "$ALGOD_URL/v2/status")"
            if [ "$PEER_HTTP_CODE" = "200" ]; then
              break
            fi
            echo "==> attempt $attempt: catchup peer /v2/status returned HTTP $PEER_HTTP_CODE, retrying in 5s"
            sleep 5
          done
          if [ "$PEER_HTTP_CODE" != "200" ]; then
            echo "fatal: catchup peer never returned HTTP 200 for /v2/status (last: $PEER_HTTP_CODE)" >&2
            echo "response body (if any):" >&2
            cat /tmp/peer-status.json >&2 2>/dev/null || true
            exit 1
          fi
          echo "==> peer reachable: $(cat /tmp/peer-status.json)"

          # Issue #1604: the peer's own /v2/status.last-catchpoint is only
          # populated when THAT node happens to be generating catchpoints
          # locally -- found live against the documented default
          # (https://mainnet-api.4160.nodely.dev): a perfectly healthy
          # /v2/status with an empty last-catchpoint, because that
          # endpoint doesn't run local catchpoint generation. go-algorand's
          # own `goal node catchup NETWORK` (no explicit label -- the
          # direct precedent for auto-discovery) never asks a peer's own
          # status at all; it fetches the Algorand-maintained static index
          # (cmd/goal/node.go's `catchpointURL` template). Use that same
          # index directly rather than depending on this specific peer
          # happening to have a fresh catchpoint of its own -- this repo's
          # own --catchpoint-auto has the same gap (tracked separately,
          # #1604) but fixing it there is out of scope for this workflow.
          CATCHPOINT_INDEX_URL="https://algorand-catchpoints.s3.us-east-2.amazonaws.com/channel/mainnet/latest.catchpoint"
          echo "==> discovering the latest mainnet catchpoint from $CATCHPOINT_INDEX_URL"
          LABEL=""
          INDEX_HTTP_CODE=""
          for attempt in 1 2 3 4 5; do
            INDEX_HTTP_CODE="$(curl -s -o /tmp/catchpoint-label.txt -w '%{http_code}' "$CATCHPOINT_INDEX_URL")"
            if [ "$INDEX_HTTP_CODE" = "200" ]; then
              LABEL="$(tr -d '[:space:]' < /tmp/catchpoint-label.txt)"
              break
            fi
            echo "==> attempt $attempt: catchpoint index returned HTTP $INDEX_HTTP_CODE, retrying in 5s"
            sleep 5
          done
          if [ "$INDEX_HTTP_CODE" != "200" ] || [ -z "$LABEL" ]; then
            echo "fatal: could not fetch a catchpoint label from $CATCHPOINT_INDEX_URL (last HTTP: $INDEX_HTTP_CODE)" >&2
            echo "response body (if any):" >&2
            cat /tmp/catchpoint-label.txt >&2 2>/dev/null || true
            exit 1
          fi
          case "$LABEL" in
            *[0-9]'#'*) ;;
            *)
              echo "fatal: catchpoint index response doesn't look like <round>#<hash>: '$LABEL'" >&2
              exit 1
              ;;
          esac
          echo "==> catchpoint label: $LABEL"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

          # Found live (fifth dispatch attempt): a raw `#` in a URL is a
          # fragment delimiter, and curl (like any URL-aware client)
          # silently strips it and everything after it before the request
          # ever goes over the wire -- the node's REST endpoint only ever
          # saw "/v2/catchup/65370000", never the hash half of the label,
          # and correctly 400'd it as unparseable. Percent-encode the
          # catchpoint label's only special character (a label is always
          # <digits>#<base32 hash>, so this is the one and only `#`).
          LABEL_URLENC="${LABEL//#/%23}"
          CATCHUP_HTTP_CODE="$(curl -s -o /tmp/catchup-response.json -w '%{http_code}' -X POST \
            -H "X-Algo-API-Token: $ALGOD_TOKEN" \
            "http://127.0.0.1:8180/v2/catchup/$LABEL_URLENC")"
          if [ "$CATCHUP_HTTP_CODE" != "200" ] && [ "$CATCHUP_HTTP_CODE" != "201" ]; then
            echo "fatal: POST /v2/catchup/$LABEL on the node returned HTTP $CATCHUP_HTTP_CODE" >&2
            cat /tmp/catchup-response.json >&2 2>/dev/null || true
            exit 1
          fi
          cat /tmp/catchup-response.json
          echo ""
          echo "==> fast catchup requested (HTTP $CATCHUP_HTTP_CODE); the clock starts now"

      - name: Poll node + peer status and detect a halt
        id: monitor
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
        run: |
          set +e
          python3 ops/mainnet-soak/monitor.py collect \
            --node-url http://127.0.0.1:8180 \
            --node-token "$ALGOD_TOKEN" \
            --peer-url "$ALGOD_URL" \
            --duration-minutes "${{ steps.params.outputs.duration_minutes }}" \
            --halt-minutes "${{ steps.params.outputs.halt_minutes }}" \
            --out mainnet-soak-artifacts/status.jsonl \
            --json-out mainnet-soak-artifacts/summary.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Tear down the node
        if: always()
        run: |
          PID="${{ steps.start_node.outputs.node_pid }}"
          if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            sleep 2
            kill -9 "$PID" 2>/dev/null || true
          fi

      - name: Capture the halted block (if any) for offline reproduction
        if: always() && fromJSON(steps.monitor.outputs.exit_code || '0') == 1
        env:
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
        run: |
          ROUND="$(python3 -c 'import json; print(json.load(open("mainnet-soak-artifacts/summary.json")).get("round") or "")')"
          if [ -n "$ROUND" ]; then
            echo "==> fetching round $ROUND from $ALGOD_URL for offline repro"
            curl -sf -H "X-Algo-API-Token: $ALGOD_TOKEN" "$ALGOD_URL/v2/blocks/$ROUND" \
              -o "mainnet-soak-artifacts/block-$ROUND.msgpack" || true
            curl -sf -H "X-Algo-API-Token: $ALGOD_TOKEN" "$ALGOD_URL/v2/blocks/$ROUND?format=json" \
              -o "mainnet-soak-artifacts/block-$ROUND.json" || true
          fi

      - name: Write the step summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os

          path = "mainnet-soak-artifacts/summary.json"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not os.path.exists(path):
              lines = ["# Mainnet node soak", "", "No summary.json was produced (the run failed before monitoring started)."]
          else:
              with open(path) as f:
                  r = json.load(f)
              lag = r.get("lag_rounds") or {}
              phase_s = r.get("phase_seconds") or {}
              lines = [
                  "# Mainnet node soak",
                  "",
                  f"**Verdict:** `{r.get('status')}` — {r.get('message') or ''}",
                  "",
                  "| metric | value |",
                  "| --- | --- |",
                  f"| Catchpoint label | `{r.get('catchpoint_label') or 'n/a'}` |",
                  f"| Fast-catchup time | {r.get('fast_catchup_seconds')} s |",
                  f"| Reached tip | {r.get('reached_tip')} |",
                  f"| Phase durations (s) | {phase_s} |",
                  f"| Lag at tip (rounds): mean/p95/max (n) | {lag.get('mean')}/{lag.get('p95')}/{lag.get('max')} (n={lag.get('n')}) |",
                  f"| Node last-round | {r.get('node_last_round')} |",
                  f"| Peer last-round | {r.get('peer_last_round')} |",
              ]
          text = "\n".join(lines) + "\n"
          print(text)
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(text)
          PYEOF

      - name: File (or comment on) an issue for a halt
        if: always() && fromJSON(steps.monitor.outputs.exit_code || '0') == 1
        env:
          GH_TOKEN: ${{ github.token }}
          ALGOD_URL: ${{ steps.params.outputs.algod_url }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          tail -n 100 mainnet-soak-artifacts/node.log > mainnet-soak-artifacts/log-excerpt.txt || true
          python3 ops/mainnet-soak/file_issue.py \
            --repo "${{ github.repository }}" \
            --verdict-json mainnet-soak-artifacts/summary.json \
            --template ops/mainnet-soak/issue_template.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifacts-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --log-excerpt-file mainnet-soak-artifacts/log-excerpt.txt \
            --peer-url "$ALGOD_URL" \
            $DRY_RUN_FLAG

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-node-soak-${{ github.run_id }}
          path: mainnet-soak-artifacts/
          if-no-files-found: warn

      - name: Fail the job on a halt or a monitor/self-test error
        if: always()
        run: |
          CODE="${{ steps.monitor.outputs.exit_code }}"
          if [ -z "$CODE" ]; then
            echo "monitor step never ran (an earlier step failed) — job already failed" >&2
            exit 1
          fi
          if [ "$CODE" -eq 0 ]; then
            echo "verdict: ok"
            exit 0
          elif [ "$CODE" -eq 2 ]; then
            echo "verdict: source_outage — warning only, not a job failure"
            exit 0
          else
            echo "verdict: halt (exit $CODE) — see the filed/commented issue"
            exit 1
          fi

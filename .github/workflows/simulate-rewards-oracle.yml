name: Simulate rewards oracle drift check

# Issue #2118: verifies that the checked-in go-algorand simulate oracle
# fixture (crates/core/algo-ledger/tests/fixtures/simulate_rewards/oracle.json)
# is not stale -- i.e. that running `tools/simulate-rewards-oracle` against a
# real, freshly-built go-algorand v5.1.1-stable reproduces the committed file
# byte-for-byte. `cargo test --workspace` reads only the committed fixture.
# The same tool also writes the issue #2125 duplicate-txid / lease oracle
# (crates/core/algo-ledger/tests/fixtures/simulate_checkdup/oracle.json,
# tools/simulate-rewards-oracle/checkdup.go) and the issue #2127 block
# validation oracle (fixtures/block_checkdup/oracle.json, blockdup.go),
# diffed the same way.
# Issue #2499 adds the ClearState pooled-budget oracle
# (fixtures/simulate_clearstate_pool/oracle.json, clearstatepool.go).
#
# Issue #2451: the same job re-runs tools/pq-failure-text-oracle (a test file
# staged into the go-algorand checkout's ledger/simulation package) and diffs
# crates/core/algo-validate/tests/fixtures/pq_failure_texts.jsonl.
#
# Issue #2470: it also re-runs tools/simulate-request-text-oracle (a test
# file staged into daemon/algod/api/server/v2/test) and diffs
# crates/node/algo-rest-api/tests/fixtures/simulate_request_texts.jsonl;
# issue #2477 adds the generated go-codec schema of the request,
# crates/node/algo-rest-api/src/simulate_request_schema.rs, to the diff.
#
# Issue #2492: it also re-runs tools/raw-submit-text-oracle (go's
# RawTransaction / RawTransactionAsync handlers) and diffs
# crates/node/algo-rest-api/tests/fixtures/raw_submit_texts.jsonl.
#
# Building go-algorand's ledger requires cgo + the vendored libsodium fork
# (see CLAUDE.md's CI Workflows section) -- `make libsodium` below.

on:
  pull_request:
    paths:
      - "tools/raw-submit-text-oracle/**"
      - "crates/node/algo-rest-api/tests/fixtures/raw_submit_texts.jsonl"
      - "tools/simulate-request-text-oracle/**"
      - "crates/node/algo-rest-api/tests/fixtures/simulate_request_texts.jsonl"
      - "crates/node/algo-rest-api/src/simulate_request_schema.rs"
      - "tools/simulate-rewards-oracle/**"
      - "crates/core/algo-ledger/tests/fixtures/simulate_rewards/**"
      - "crates/core/algo-ledger/tests/fixtures/simulate_checkdup/**"
      - "crates/core/algo-ledger/tests/fixtures/block_checkdup/**"
      - "crates/core/algo-ledger/tests/fixtures/simulate_clearstate_pool/**"
      - "tools/pq-failure-text-oracle/**"
      - "crates/core/algo-validate/tests/fixtures/pq_failure_texts.jsonl"
      - ".github/workflows/simulate-rewards-oracle.yml"
  push:
    branches: [main]
    paths:
      - "tools/raw-submit-text-oracle/**"
      - "crates/node/algo-rest-api/tests/fixtures/raw_submit_texts.jsonl"
      - "tools/simulate-request-text-oracle/**"
      - "crates/node/algo-rest-api/tests/fixtures/simulate_request_texts.jsonl"
      - "crates/node/algo-rest-api/src/simulate_request_schema.rs"
      - "tools/simulate-rewards-oracle/**"
      - "crates/core/algo-ledger/tests/fixtures/simulate_rewards/**"
      - "crates/core/algo-ledger/tests/fixtures/simulate_checkdup/**"
      - "crates/core/algo-ledger/tests/fixtures/block_checkdup/**"
      - "crates/core/algo-ledger/tests/fixtures/simulate_clearstate_pool/**"
      - "tools/pq-failure-text-oracle/**"
      - "crates/core/algo-validate/tests/fixtures/pq_failure_texts.jsonl"
      - ".github/workflows/simulate-rewards-oracle.yml"
  workflow_dispatch:

concurrency:
  group: simulate-rewards-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin go-algorand to the same rev the rest of the repo references.
  GO_ALGORAND_REV: "v5.1.1-stable"

jobs:
  oracle-drift-check:
    name: Regenerate simulate oracle fixture from real go-algorand and diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone go-algorand
        run: |
          set -euo pipefail
          # Sibling of the checkout: the tool's go.mod `replace` resolves
          # go-algorand at ../../../go-algorand, the local-dev convention.
          git clone --depth 1 --branch "$GO_ALGORAND_REV" \
            https://github.com/algorand/go-algorand.git \
            "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          grep -E '^(go|toolchain) ' "$(dirname "$GITHUB_WORKSPACE")/go-algorand/go.mod"

      - name: Install Go per go-algorand's go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ github.workspace }}/../go-algorand/go.mod
          cache-dependency-path: tools/simulate-rewards-oracle/go.sum

      - name: Build go-algorand's libsodium fork
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential
          cd "$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          make libsodium

      - name: Run the oracle tool and diff against the committed fixture
        run: |
          set -euo pipefail
          cd tools/simulate-rewards-oracle
          go run .
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- \
            crates/core/algo-ledger/tests/fixtures/simulate_rewards/oracle.json \
            crates/core/algo-ledger/tests/fixtures/simulate_checkdup/oracle.json \
            crates/core/algo-ledger/tests/fixtures/block_checkdup/oracle.json \
            crates/core/algo-ledger/tests/fixtures/simulate_clearstate_pool/oracle.json || {
            echo "::error::a committed oracle.json is stale -- regenerate via 'cd tools/simulate-rewards-oracle && go run .' against the pinned go-algorand checkout and commit the result"
            exit 1
          }

      - name: Run the PQ failure-text oracle and diff against the committed fixture
        run: |
          set -euo pipefail
          GO_ALGORAND="$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          STAGED="$GO_ALGORAND/ledger/simulation/zz_algod_rust_pq_failure_text_oracle_test.go"
          cp tools/pq-failure-text-oracle/oracle_test.go "$STAGED"
          (cd "$GO_ALGORAND" && ORACLE_OUT="$GITHUB_WORKSPACE/crates/core/algo-validate/tests/fixtures/pq_failure_texts.jsonl" \
            go test -count=1 -run '^TestAlgodRustPQFailureTextOracle$' ./ledger/simulation/)
          rm -f "$STAGED"
          git diff --exit-code -- crates/core/algo-validate/tests/fixtures/pq_failure_texts.jsonl || {
            echo "::error::pq_failure_texts.jsonl is stale -- regenerate via tools/pq-failure-text-oracle/run-in-docker.sh against the pinned go-algorand checkout and commit the result"
            exit 1
          }

      - name: Run the simulate request-text oracle and diff against the committed fixture
        run: |
          set -euo pipefail
          GO_ALGORAND="$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          STAGED="$GO_ALGORAND/daemon/algod/api/server/v2/test/zz_algod_rust_simulate_request_text_oracle_test.go"
          cp tools/simulate-request-text-oracle/oracle_test.go "$STAGED"
          (cd "$GO_ALGORAND" && ORACLE_OUT="$GITHUB_WORKSPACE/crates/node/algo-rest-api/tests/fixtures/simulate_request_texts.jsonl" \
            SCHEMA_OUT="$GITHUB_WORKSPACE/crates/node/algo-rest-api/src/simulate_request_schema.rs" \
            go test -count=1 -run '^TestAlgodRustSimulateRequest(TextOracle|Schema)$' ./daemon/algod/api/server/v2/test/)
          rm -f "$STAGED"
          git diff --exit-code -- crates/node/algo-rest-api/tests/fixtures/simulate_request_texts.jsonl \
            crates/node/algo-rest-api/src/simulate_request_schema.rs || {
            echo "::error::simulate_request_texts.jsonl or simulate_request_schema.rs is stale -- regenerate via tools/simulate-request-text-oracle/run-in-docker.sh against the pinned go-algorand checkout and commit the result"
            exit 1
          }

      - name: Run the raw-submit text oracle and diff against the committed fixture
        run: |
          set -euo pipefail
          GO_ALGORAND="$(dirname "$GITHUB_WORKSPACE")/go-algorand"
          STAGED="$GO_ALGORAND/daemon/algod/api/server/v2/test/zz_algod_rust_raw_submit_text_oracle_test.go"
          cp tools/raw-submit-text-oracle/oracle_test.go "$STAGED"
          (cd "$GO_ALGORAND" && ORACLE_OUT="$GITHUB_WORKSPACE/crates/node/algo-rest-api/tests/fixtures/raw_submit_texts.jsonl"             go test -count=1 -run '^TestAlgodRustRawSubmitTextOracle$' ./daemon/algod/api/server/v2/test/)
          rm -f "$STAGED"
          git diff --exit-code -- crates/node/algo-rest-api/tests/fixtures/raw_submit_texts.jsonl || {
            echo "::error::raw_submit_texts.jsonl is stale -- regenerate via tools/raw-submit-text-oracle/run-in-docker.sh against the pinned go-algorand checkout and commit the result"
            exit 1
          }

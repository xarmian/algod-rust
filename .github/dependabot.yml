#
# Issue #1671: propose dependency updates weekly, grouped so a week's worth
# of semver-compatible bumps lands as one reviewable PR (consensus-critical
# crates still go through the full suite + parity jobs before merge).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, team:b]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    # Major bumps that need a coordinated migration (issue #1839): rand 0.10
    # renames the whole API and moves rand_core, which the seeded
    # rand_chacha 0.3 test RNGs and the key-generation paths in
    # algo-consensus-crypto depend on; the ark-* crates (BN254/BLS12-381 AVM
    # ops) must move together. Re-enable when that migration is scheduled.
    ignore:
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ark-*"
        update-types: ["version-update:semver-major"]
      # statrs 0.19 (and nalgebra/wide/safe_arch) need rustc 1.89 > MSRV 1.88.
      - dependency-name: "statrs"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # RustCrypto digest 0.11 train (sha2 0.11, hkdf 0.13, ...): the
      # dependent crates (hmac, blake2, sha3, ed25519-dalek, ...) must move
      # together or trait bounds (CoreProxy/FixedOutput) mismatch.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "hkdf"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, team:b]
    groups:
      actions:
        patterns: ["*"]

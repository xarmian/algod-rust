#
# Issue #1671: propose dependency updates weekly, grouped so a week's worth
# of semver-compatible bumps lands as one reviewable PR (consensus-critical
# crates still go through the full suite + parity jobs before merge).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, team:b]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    # Held (issue #1828): hickory-resolver 0.26.3 validates the mainnet SRV
    # set unreliably; the ignored live test
    # `live_mainnet_srv_validates_with_default_resolver` guards the next
    # release. Everything else (rand 0.10, RustCrypto digest 0.11 train,
    # ark-* 0.6, ...) moved in issue #1869.
    ignore:
      - dependency-name: "hickory-resolver"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, team:b]
    groups:
      actions:
        patterns: ["*"]

# `vulnerability` and `notice` were removed from cargo-deny's schema
# (current versions always error on both; there is no longer a lint-level
# knob for them). `unmaintained` changed from a lint-level ("warn"/"deny")
# to a scope selector; "workspace" here means only direct workspace
# dependencies are checked against RUSTSEC unmaintained advisories.
[advisories]
unmaintained = "workspace"
yanked = "warn"

# `unlicensed` was removed from cargo-deny's schema — recent versions
# always require every non-excepted dependency to resolve to an `allow`ed
# license (no separate lint-level for "no license field at all" vs. "wrong
# license"); see the `ring` note below for the one dependency this repo
# currently has that lacks a `license` field.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    # webpki-roots ships only Mozilla's root-CA data under this permissive
    # data license (attribution/notice-preservation only, no copyleft) — see
    # docs/DEPENDENCY_LICENSES.md.
    "CDLA-Permissive-2.0",
    # cargo-deny checks first-party workspace crates' own `license` field
    # against this same allow-list, not just third-party dependencies. Most
    # of algod-rust's workspace crates are correctly, deliberately licensed
    # AGPL-3.0-or-later (see docs/LICENSING_AUDIT.md) — this entry lets
    # those crates pass their own self-check. It is NOT a statement that an
    # AGPL third-party *dependency* would be fine to pull in: the manual
    # audit in docs/DEPENDENCY_LICENSES.md confirms zero of the 588
    # external dependencies are AGPL/GPL-family, and that remains the
    # substance of this check.
    "AGPL-3.0-or-later",
]

# `ring 0.16.20` (a transitive TLS/crypto dependency present in Cargo.lock)
# has, for several releases, shipped with no Cargo.toml `license` field at
# all — a well-known upstream quirk, not something specific to algod-rust.
# Its own LICENSE file states a mix of an ISC-style license (original code)
# and the OpenSSL license (code derived from BoringSSL/OpenSSL), both
# permissive. This session could not read that vendored LICENSE file or run
# cargo-deny to see whether it would need an explicit `[[licenses.clarify]]`
# entry (see docs/DEPENDENCY_LICENSES.md) — but CI's real `cargo-deny` run
# reports a clean `licenses ok` with no rejection for `ring` at all, meaning
# either the resolver/target combination cargo-deny actually checks doesn't
# pull in this particular `ring` version, or cargo-deny's own crate-level
# override list already knows about it. No `clarify` block has turned out
# to be necessary in practice; if a future `cargo-deny` run ever does reject
# `ring` for a missing license, add one then using the hash the error
# message reports.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

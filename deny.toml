# `vulnerability` and `notice` were removed from cargo-deny's schema
# (current versions always error on both; there is no longer a lint-level
# knob for them). `unmaintained` changed from a lint-level ("warn"/"deny")
# to a scope selector; "workspace" here means only direct workspace
# dependencies are checked against RUSTSEC unmaintained advisories.
[advisories]
unmaintained = "workspace"
yanked = "warn"

# `unlicensed` was removed from cargo-deny's schema — recent versions
# always require every non-excepted dependency to resolve to an `allow`ed
# license (no separate lint-level for "no license field at all" vs. "wrong
# license"); see the `ring` note below for the one dependency this repo
# currently has that lacks a `license` field.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    # webpki-roots ships only Mozilla's root-CA data under this permissive
    # data license (attribution/notice-preservation only, no copyleft) — see
    # docs/DEPENDENCY_LICENSES.md.
    "CDLA-Permissive-2.0",
]

# `ring` (a transitive TLS/crypto dependency) has, for several releases,
# shipped with no Cargo.toml `license` field at all — a well-known upstream
# quirk, not something specific to algod-rust. Its own LICENSE file states a
# mix of an ISC-style license (original code) and the OpenSSL license (code
# derived from BoringSSL/OpenSSL), both permissive. This session could not
# run cargo-deny itself to compute the license-file hash `clarify` requires
# (see docs/DEPENDENCY_LICENSES.md for why); when CI's first real run
# reports the correct hash, replace this comment with a proper
# `[[licenses.clarify]]` block. Until then the `dependency-licenses` CI job
# stays advisory (`continue-on-error: true`) specifically because of this
# gap, not because the license itself is in doubt.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

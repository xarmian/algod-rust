# Paired Go/Rust micro-benchmark registry (issue #2103, epic #2101).
#
# One [[pair]] per comparison. `make bench-compare TIERS=micro` runs the Go
# benchmark `go_bench` (package `go_package`, module benchmarks/go-micro) and
# the Rust criterion benchmark `rust_bench` (crate algo-bench-pairs, bench
# target `pairs`) on the same `fixture` (benchmarks/fixtures/micro/<fixture>,
# whose sha256 must equal `fixture_sha256`), and reports Rust/Go per `id`.
# Before timing anything the tier runs every pair once on both sides and
# requires identical output digests (scripts/bench/micro_equiv.py).
#
# `go_api` / `rust_api` name the production function each side measures.
# go-algorand's own Benchmark* functions (crypto.BenchmarkHash,
# BenchmarkVerify25519, BenchmarkBatchVerifier*, the logic package's
# benchmarkOperation family, msgp_gen_test's BenchmarkUnmarshal*) were
# reviewed first: every one of them draws its input from crypto.RandBytes /
# protocol.RandomizeObject or an inline source the Rust side cannot read, so
# none measures "the same thing on the same bytes". The pairs therefore use
# thin testing.B wrappers in benchmarks/go-micro that call the same go-algorand
# APIs on the shared fixtures.
#
# Checked by scripts/bench/test_pairs.py (also in CI: the static part runs in
# the bench-compare-harness job, `go test -list` in the bench-micro job).
# Regenerate fixtures with `go run ./cmd/genfixtures` in benchmarks/go-micro
# and update the sha256s here; see docs/BENCHMARK_COMPARISON.md "micro tier".

schema = 1
fixture_dir = "benchmarks/fixtures/micro"
go_module = "benchmarks/go-micro"
rust_package = "algo-bench-pairs"
rust_bench_target = "pairs"

[[pair]]
id = "codec/decode-block-small"
unit = "ns/op"
go_package = "github.com/xarmian/algod-rust/benchmarks/go-micro"
go_bench = "BenchmarkCodecDecodeBlockSmall"
go_api = "protocol.Decode(b, &bookkeeping.Block{})"
rust_bench = "codec/decode-block-small"
rust_api = "algo_codec::decode_block"
fixture = "block-small.msgpack"
fixture_sha256 = "3fce5949864b38b8a16fbfae183c7236b8a589e32240ed46c49ffd19f8250d5d"


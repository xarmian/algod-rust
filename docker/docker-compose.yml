services:
  algod-go:
    image: algorand/algod:4.7.0-stable
    container_name: algod-go
    environment:
      - DEV_MODE=1
      - TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ports:
      - "4001:8080"
    volumes:
      - algod-data:/algod/data
      - ./scripts:/scripts:ro
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
          "http://localhost:8080/v2/status",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  txn-generator:
    image: algorand/algod:4.7.0-stable
    container_name: txn-generator
    depends_on:
      algod-go:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/generate-txns.sh"]
    volumes:
      - ./scripts/generate-txns.sh:/scripts/generate-txns.sh:ro
      - algod-data:/algod/data
    environment:
      - ALGOD_DATA=/algod/data
      - TXN_INTERVAL=5
      - TXN_BATCH_SIZE=1

  algod-rust:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: algod-rust
    depends_on:
      algod-go:
        condition: service_healthy
    environment:
      - ALGOD_URL=http://algod-go:8080
      - ALGOD_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    volumes:
      - ../fixtures:/app/fixtures
      - ../reports:/app/reports
    profiles:
      - rust

  algod-archival:
    image: algorand/algod:4.7.0-stable
    container_name: algod-archival
    environment:
      - TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ports:
      - "4002:8080"
    volumes:
      - algod-archival-data:/algod/data
      - ./config/archival-config.json:/etc/algorand/config.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
          "http://localhost:8080/v2/status",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles:
      - archival

volumes:
  algod-data:
  algod-archival-data:

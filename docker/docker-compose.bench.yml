# Controlled Benchmarking Environment
#
# Provides a resource-limited Go algod node for reproducible benchmark
# comparisons between Go and Rust block replay.
#
# Usage:
#   docker compose -f docker/docker-compose.bench.yml up -d
#   docker compose -f docker/docker-compose.bench.yml down -v

services:
  algod-bench:
    image: algorand/algod:5.0.0-stable
    container_name: algod-bench
    environment:
      - TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ports:
      - "4010:8080"
    volumes:
      - bench-data:/algod/data
      - ./config/archival-config.json:/etc/algorand/config.json:ro
      - bench-output:/bench-output
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
          "http://localhost:8080/v2/status",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  bench-data:
  bench-output:

# PLAN-32 / TASK-86 — 4-node mixed-cluster consensus harness.
#
# Topology: 3 go-algorand v4.5.1-stable relay nodes + 1 algod-rust node,
# all peers, all meant to see the same genesis and progress through
# agreement together. The netroot layout under `./netroot/` is produced
# up-front by `scripts/start.sh` running `goal network create`
# (see ./template.json).
#
# The 4 nodes talk to each other via the `phase6net` bridge network using
# container-DNS hostnames. Each Go node's REST API is exposed on a
# distinct host port (4001-4003) for off-cluster inspection; the Rust
# node exposes its gossip port on 4160.
#
# Scope for TASK-86:
#   - All 4 nodes start, see each other as peers, share one genesis.
#   - 3 Go nodes actively participate (each holds ~33% of stake).
#   - The Rust node is a relay peer that syncs blocks via gossip; it is
#     NOT yet expected to propose — participation-key interop with the
#     Go-generated netroot format is tracked as a follow-up (see
#     `docs/MIXED_CLUSTER_HARNESS.md`).
#
# Usage:
#   ops/mixed-cluster/scripts/start.sh     # generate netroot + start
#   ops/mixed-cluster/scripts/status.sh    # per-node round snapshot
#   ops/mixed-cluster/scripts/stop.sh      # tear down + cleanup

services:
  go-node-1:
    image: algorand/algod:4.5.1-stable
    container_name: phase6-go-node-1
    environment:
      - ALGORAND_DATA=/algod/data
      - ALGOD_PORT=8080
      - TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      # Semicolon-separated peer list passed through to `algod -p`.
      # See the algorand/algod entrypoint's `start_public_network` path.
      - PEER_ADDRESS=go-node-2:4161;go-node-3:4161
    ports:
      - "4001:8080"
    volumes:
      # Each Go node mounts ONLY its own netroot subdirectory as
      # /algod/data. The parent /algod directory is left unmounted so the
      # image's entrypoint doesn't try to iterate over read-only
      # sibling mounts when populating algod.token files.
      - ./netroot/Node1:/algod/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -H
        - "X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        - http://localhost:8080/v2/status
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - phase6net

  go-node-2:
    image: algorand/algod:4.5.1-stable
    container_name: phase6-go-node-2
    environment:
      - ALGORAND_DATA=/algod/data
      - ALGOD_PORT=8080
      - TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - PEER_ADDRESS=go-node-1:4161;go-node-3:4161
    ports:
      - "4002:8080"
    volumes:
      - ./netroot/Node2:/algod/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -H
        - "X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        - http://localhost:8080/v2/status
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - phase6net

  go-node-3:
    image: algorand/algod:4.5.1-stable
    container_name: phase6-go-node-3
    environment:
      - ALGORAND_DATA=/algod/data
      - ALGOD_PORT=8080
      - TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - PEER_ADDRESS=go-node-1:4161;go-node-2:4161
    ports:
      - "4003:8080"
    volumes:
      - ./netroot/Node3:/algod/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -H
        - "X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        - http://localhost:8080/v2/status
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - phase6net

  # The Rust node runs as a relay peer pointed at the 3 Go relays via
  # gossip. It syncs blocks as they're produced and serves them back
  # through the gossip port on 4160. Full consensus participation
  # requires porting the Go participation-key format — see
  # MIXED_CLUSTER_HARNESS.md for the follow-up plan.
  rust-node-4:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: phase6-rust-node-4
    depends_on:
      go-node-1:
        condition: service_healthy
      go-node-2:
        condition: service_healthy
      go-node-3:
        condition: service_healthy
    environment:
      - RUST_LOG=info,algod_rust=debug,algo_network=debug,algo_agreement=info
    entrypoint:
      - algod-rust
      - relay
      - --bind-address=0.0.0.0:4160
      - --genesis-id=phase6net-v1
      - --ledger-path=/app/ledger.sqlite
      - --peers=go-node-1:4161,go-node-2:4161,go-node-3:4161
    ports:
      - "4160:4160"
    volumes:
      - rust-node-4-data:/app
    restart: unless-stopped
    networks:
      - phase6net

volumes:
  rust-node-4-data:

networks:
  phase6net:
    driver: bridge

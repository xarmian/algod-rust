[workspace]
resolver = "2"
members = [
    "crates/core/algo-error",
    "crates/core/algo-types",
    "crates/core/algo-codec",
    "crates/node/algo-rest-client",
    "crates/node/algo-config",
    "crates/tools/algo-fixtures",
    "crates/tools/algo-conformance",
    "crates/core/algo-validate",
    "crates/core/algo-ledger",
    "crates/core/algo-avm",
    "crates/core/algo-falcon",
    "crates/core/algo-consensus-crypto",
    "crates/core/algo-agreement",
    "crates/core/algo-pool",
    "crates/node/algo-network",
    "crates/node/algo-p2p",
    "crates/node/algo-rest-api",
    "crates/node/algo-kmd",
    "crates/node/algo-kmd-api-types",
    "crates/node/algo-kmd-client",
    "crates/node/algo-txn-pipeline",
    "crates/tools/algo-bench",
    "crates/tools/algo-fork-detector",
    "crates/tools/algo-cert-crossverify",
    "crates/tools/algo-agreement-fuzz",
    "crates/tools/algokey-rust",
    "crates/tools/goal-rust",
    "bin/algod-rust",
    "bin/kmd-rust",
]
exclude = ["fuzz"]

# The stress-benchmark binary (docker/Dockerfile builds `--release`) is
# compared head-to-head against go-algorand's optimized builds (issue #100).
# Cargo's release defaults (no LTO, 16 codegen units) leave measurable CPU
# on the table for a consensus node; thin LTO + a single codegen unit are
# the standard settings for a performance-sensitive release binary and do
# not change behavior.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp = "0.8"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }

# HTTP
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout"] }
hyper = { version = "1", features = ["server", "http1"] }
subtle = "2"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Crypto
ed25519-dalek = { version = "2", features = ["std", "zeroize"] }
curve25519-dalek = { version = "4", features = ["alloc"] }
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
hex = "0.4"
serde_bytes = "0.11"
data-encoding = "2"
base64 = "0.22"
scrypt = { version = "0.11", default-features = false }
xsalsa20poly1305 = "0.9"
hkdf = "0.12"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Workspace crates
algo-error = { path = "crates/core/algo-error" }
algo-types = { path = "crates/core/algo-types" }
algo-codec = { path = "crates/core/algo-codec" }
algo-rest-client = { path = "crates/node/algo-rest-client" }
algo-config = { path = "crates/node/algo-config" }
algo-fixtures = { path = "crates/tools/algo-fixtures" }
algo-conformance = { path = "crates/tools/algo-conformance" }
algo-validate = { path = "crates/core/algo-validate" }
algo-ledger = { path = "crates/core/algo-ledger" }
algo-avm = { path = "crates/core/algo-avm" }
algo-consensus-crypto = { path = "crates/core/algo-consensus-crypto" }
algo-agreement = { path = "crates/core/algo-agreement" }
algo-pool = { path = "crates/core/algo-pool" }
algo-falcon = { path = "crates/core/algo-falcon" }
algo-network = { path = "crates/node/algo-network" }
algo-p2p = { path = "crates/node/algo-p2p" }
algo-rest-api = { path = "crates/node/algo-rest-api" }
algo-kmd = { path = "crates/node/algo-kmd" }
algo-kmd-api-types = { path = "crates/node/algo-kmd-api-types" }
algo-kmd-client = { path = "crates/node/algo-kmd-client" }
algo-txn-pipeline = { path = "crates/node/algo-txn-pipeline" }
algo-bench = { path = "crates/tools/algo-bench" }
num-bigint = "0.4"
num-traits = "0.2"
statrs = "0.18"

# Elliptic curves (for AVM ec_* opcodes)
ark-ff = "0.5"
ark-ec = { version = "0.5", features = ["parallel"] }
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"
ark-serialize = "0.5"

# System info
sysinfo = "0.33"

# Compression / archive
snap = "1"
tar = "0.4"
flate2 = "1"
zstd = "0.13"

# Networking (WebSocket)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
parking_lot = "0.12"
rand = "0.8"
zeroize = "1"
http = "1"
url = "2"
hickory-resolver = { version = "0.25", features = ["dnssec-ring", "tokio"] }
regex = "1"
crossbeam-channel = "0.5"

# TLS
tokio-rustls = "0.26"
rustls-pemfile = "2"

[workspace]
resolver = "2"
members = [
    "crates/core/algo-error",
    "crates/core/algo-types",
    "crates/core/algo-codec",
    "crates/node/algo-rest-client",
    "crates/tools/algo-fixtures",
    "crates/tools/algo-conformance",
    "crates/core/algo-validate",
    "crates/core/algo-ledger",
    "bin/algod-rust",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp = "0.8"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Crypto
ed25519-dalek = { version = "2", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
serde_bytes = "0.11"
data-encoding = "2"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Workspace crates
algo-error = { path = "crates/core/algo-error" }
algo-types = { path = "crates/core/algo-types" }
algo-codec = { path = "crates/core/algo-codec" }
algo-rest-client = { path = "crates/node/algo-rest-client" }
algo-fixtures = { path = "crates/tools/algo-fixtures" }
algo-conformance = { path = "crates/tools/algo-conformance" }
algo-validate = { path = "crates/core/algo-validate" }
algo-ledger = { path = "crates/core/algo-ledger" }

[package]
name = "algod-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "algod-rust"
path = "src/main.rs"

[dependencies]
algo-types.workspace = true
algo-codec.workspace = true
algo-error.workspace = true
algo-network.workspace = true
algo-rest-client.workspace = true
algo-config.workspace = true
algo-validate.workspace = true
algo-bench.workspace = true
algo-conformance.workspace = true
algo-ledger.workspace = true
algo-consensus-crypto.workspace = true
algo-agreement.workspace = true
algo-pool.workspace = true
algo-avm.workspace = true
algo-fixtures.workspace = true
algo-rest-api.workspace = true
algo-txn-pipeline.workspace = true
algo-p2p.workspace = true
axum.workspace = true
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "tokio", "kad", "identify", "gossipsub", "macros"] }
async-trait.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rmpv.workspace = true
rmp-serde.workspace = true
rmp.workspace = true
rusqlite.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
toml = "0.8"
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
# Serving axum::Router HTTP handlers (CatchpointService/BlockService, both
# transport-agnostic per issue #955) over a raw libp2p stream (issue #1024) --
# `algo-network`'s classic WS-gossip transport already depends on both for
# the identical purpose (see `ws_network.rs`'s `hyper::server::conn::http1`
# usage); the P2P transport lives in this binary crate rather than
# `algo-p2p` (which deliberately has no `axum`/`hyper` dependency), so the
# same pair is needed here too.
hyper.workspace = true
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[dev-dependencies]
serde_bytes = "0.11"
tempfile = "3"
base64.workspace = true
flate2.workspace = true

# cargo-nextest configuration. The default profile is untouched (local runs
# fail fast on the first flake so it is noticed). The `ci` profile is used by
# .github/workflows/unit-tests.yml (`cargo nextest run --profile ci`).

[profile.ci]
# Run every test and list all failures in one log instead of stopping at the
# first failing binary.
fail-fast = false

# Default: NO retries, so a genuine race in any ordinary test fails loudly.
retries = 0

# Hard-kill any single test after 20 x 60s = 20 min, so one hung test names
# itself instead of consuming the whole job timeout. Tests running longer than
# 60s are flagged SLOW in the log.
slow-timeout = { period = "60s", terminate-after = 20 }

# Retries (2) only for the known load-sensitive test below on the shared
# 4-core runner. A retried pass is reported as FLAKY in the log (and surfaced
# in the job summary by the workflow), so it stays visible.
#   - lookback_prefetch bounded-lookahead timing assertion (issue #1723)
# The real-thread multi-node agreement harness (service_multi_node_test,
# issues #1693/#1695) NO LONGER has a retry override: its quiescence
# detection is exact (no debounce) and a latent proposal-tail bug that made
# fast_recovery_late/redo converge on the wrong block was fixed (#1695), so a
# failure there is a real finding and must fail loudly.
[[profile.ci.overrides]]
filter = 'test(/lookback_prefetch::/)'
retries = 2

# NOTE: the PR Unit Tests workflow EXCLUDES the `service_multi_node_test`
# binary (via a `-E` filter on the command line, see
# .github/workflows/unit-tests.yml); it runs in release on PRs touching the
# agreement/consensus crates via .github/workflows/agreement-multinode.yml
# (issue #1752) and in the daily Coverage workflow.

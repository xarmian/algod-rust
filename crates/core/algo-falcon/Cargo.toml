[package]
name = "algo-falcon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The vendored C library (falcon-c/, github.com/algorand/falcon v0.1.0) as a
# runtime-selectable backend. On by default so `FalconBackend = "c"` works;
# `--no-default-features` builds the pure-Rust crate without a C compiler
# (DIV-001, docs/DIVERGENCES.md).
default = ["c-backend"]
c-backend = []
# Test-only: also compiles falcon-c-test/shim_*.c, which re-export the C
# library's `static` internals so the per-module differential tests in
# src/rs/ can diff the Rust port against them. Never used by a release build.
c-internals-test = ["c-backend"]

[dependencies]

[dev-dependencies]
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true

[build-dependencies]
cc = "1"

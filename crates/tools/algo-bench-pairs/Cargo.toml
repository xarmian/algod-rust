[package]
name = "algo-bench-pairs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust half of the paired Go/Rust micro-benchmarks (issue #2103): one case per benchmarks/pairs.toml entry"
publish = false

[dependencies]
algo-types.workspace = true
algo-codec.workspace = true
algo-validate.workspace = true
algo-avm.workspace = true
algo-ledger.workspace = true
algo-consensus-crypto.workspace = true
algo-falcon.workspace = true
algo-agreement.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "pairs"
harness = false

[[bin]]
name = "micro-equiv"
path = "src/bin/micro_equiv.rs"

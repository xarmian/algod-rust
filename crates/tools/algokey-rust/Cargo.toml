[package]
name = "algokey-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "algokey-rust"
path = "src/main.rs"

[features]
# Opt-in feature for end-to-end tests that drive a live algod-go localnet
# (`make localnet-up`). Default `cargo test -p algokey-rust` runs in-process
# unit tests only — no docker required.
e2e = []

[dependencies]
clap = { workspace = true }
algo-codec.workspace = true
algo-consensus-crypto.workspace = true
algo-ledger.workspace = true
algo-types.workspace = true
data-encoding = { workspace = true }
ed25519-dalek.workspace = true
rand.workspace = true
rmp-serde = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
hex.workspace = true
tempfile = "3"
data-encoding = { workspace = true }
# Used by the e2e harness (gated behind `--features e2e`).
algo-error.workspace = true
algo-rest-client.workspace = true
assert_cmd = "2"
base64.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# E2E smoke test — only compiled with `--features e2e`. Validates that the
# harness can bring up a localnet, discover the funded account, submit a
# self-pay, and observe confirmation. See TASK-184.
[[test]]
name = "e2e_smoke"
path = "tests/e2e/smoke_test.rs"
required-features = ["e2e"]

# Headline keyreg interop test (TASK-185). Exercises the full algokey-rust
# binary chain (generate → part generate → part keyreg → sign → submit) against
# a live algod-go localnet. Run with `--test-threads=1` to avoid races on
# `Localnet::bring_up()` when multiple e2e test binaries run in parallel.
[[test]]
name = "e2e_keyreg"
path = "tests/e2e/keyreg_flow_test.rs"
required-features = ["e2e"]

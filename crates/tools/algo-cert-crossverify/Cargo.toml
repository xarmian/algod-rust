[package]
name = "algo-cert-crossverify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# PLAN-32 / TASK-88 — Certificate cross-verification tool.
#
# Fetches a (block, cert) pair from an algod REST endpoint and verifies
# the cert under algod-rust's `Certificate::authenticate` using an
# AgreementLedgerBridge over a read-only SQLite ledger snapshot. The
# sqlite snapshot must already be caught up to the target round (in the
# TASK-86 mixed cluster, this comes from the Rust relay's own ledger).
#
# Issue #470 §2 adds the inverse direction: with the Rust node online
# and voting (#469), `--rust-account` asserts its votes are present in
# the committed certificates, and `--export-go-input` writes a bundle
# that `tools/cert-authenticate` replays through go-algorand's own
# `agreement.Certificate.Authenticate`.

[[bin]]
name = "algo-cert-crossverify"
path = "src/main.rs"

[dependencies]
algo-agreement.workspace = true
algo-codec.workspace = true
algo-consensus-crypto.workspace = true
algo-ledger.workspace = true
algo-rest-client.workspace = true
algo-types.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
rmp-serde.workspace = true
rmpv.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

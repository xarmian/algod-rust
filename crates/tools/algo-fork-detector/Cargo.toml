[package]
name = "algo-fork-detector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# PLAN-32 / TASK-88 — mixed-cluster fork detector.
#
# Polls /v2/blocks/{r} across N algod REST endpoints, computes the block
# digest from the returned Block struct, and asserts that every node
# reports the same digest per round. Exits non-zero on any mismatch so
# the invocation is CI/script-friendly.

[[bin]]
name = "algo-fork-detector"
path = "src/main.rs"

[dependencies]
algo-types.workspace = true
algo-codec.workspace = true
algo-rest-client.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]

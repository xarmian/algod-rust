[package]
name = "algo-agreement-fuzz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Issue #472 — negative Layer-9 consensus conformance.
#
# Constructs agreement messages (AV votes, PP proposal payloads) that are
# byte-identical to an honest node's output except for exactly one injected
# fault, and injects a single such message into a live go-algorand node over
# gossip so that Go's rejection is attributable only to that fault.
#
# The construction/corruption half (`lib.rs`) is pure and unit tested without
# Docker; only `src/inject.rs` + `src/main.rs` touch the network.

[[bin]]
name = "algo-agreement-fuzz"
path = "src/main.rs"

[dependencies]
algo-agreement.workspace = true
algo-codec.workspace = true
algo-consensus-crypto.workspace = true
algo-ledger.workspace = true
algo-network.workspace = true
algo-types.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

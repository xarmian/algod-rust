[package]
name = "algo-network"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
algo-agreement.workspace = true
algo-types.workspace = true
algo-codec.workspace = true
algo-error.workspace = true
algo-pool.workspace = true
algo-config.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes = "1"
http-body = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower-service = "0.3"
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zstd.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
rand.workspace = true
http.workspace = true
url.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
rmp.workspace = true
rmp-serde.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
hickory-resolver.workspace = true
regex.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
# HTTP client for the TxSyncer pull protocol's peer client (issue #774):
# `TxSyncService`'s HTTP server already needed axum; the peer-side client
# needs an HTTP client, and `reqwest` was already a vetted workspace
# dependency used as a production dependency elsewhere (`bin/algod-rust`,
# `algo-rest-client`) — promoted here from dev-only rather than adding a
# genuinely new dependency.
reqwest.workspace = true
# Catchpoint files are gzip-compressed tarballs on disk (matching go's own
# convention); the catchpoint-serving HTTP endpoint (issue #955) needs to
# decompress them for callers that don't advertise `Accept-Encoding: gzip`,
# mirroring go's `rpcs.LedgerService`'s use of `compress/gzip`.
flate2.workspace = true

# Real `getrlimit`/`setrlimit` FD accounting (go: `util.GetFdLimits`/
# `SetFdSoftLimit`, `util/util.go`, Unix-only there too — go's own
# `util_windows.go` build tag hard-codes "unlimited" on Windows instead of
# calling into any Windows API, so algo-network mirrors that rather than
# reaching for a Windows-specific handle-count API of its own).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
rmpv.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
algo-consensus-crypto.workspace = true

[package]
name = "algo-p2p"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libp2p = { version = "0.57", features = [
    "tcp",
    "noise",
    "yamux",
    "tokio",
    "kad",
    "identify",
    "gossipsub",
    "macros",
] }
# libp2p-stream must track the `libp2p` facade version above: 0.4.0-alpha is
# the release built against the libp2p-swarm / libp2p-core copies that
# libp2p 0.56.x re-exports. A mismatched libp2p-stream pulls in a *second*,
# incompatible copy of libp2p-swarm/-core, and `libp2p_stream::Behaviour` then
# implements a different `NetworkBehaviour` trait than the one
# `#[derive(NetworkBehaviour)]` on `P2pBehaviour` (host.rs) uses — a hard
# compile error, not a version warning. Bump only in lockstep with `libp2p`.
libp2p-stream = "0.5.0-alpha"
# Used to derive the raw Ed25519 signing key underlying a `libp2p::identity`
# `Keypair`, for `identity::to_identity_signing_key` (issue #1133) — the
# adapter that lets the P2P transport's own peer identity drive
# `algo_network::identity`'s netidentity challenge/response/verification
# scheme in hybrid mode, mirroring go's `network/p2p.PeerIDChallengeSigner`.
ed25519-dalek.workspace = true
tokio.workspace = true
thiserror.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
hickory-resolver.workspace = true
tracing.workspace = true
sha2.workspace = true
blake2.workspace = true
rmp-serde.workspace = true
void = "1"
url.workspace = true

[dev-dependencies]
tempfile = "3"
hex.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
rand.workspace = true
